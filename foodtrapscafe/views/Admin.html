<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodtraps Admin</title><style>body{font-family:Arial;margin:0;background:#f4f5f7;color:#222;font-size:14px}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}button,input,select,textarea{font:inherit}.nav button,.btn{font-size:12px}table{font-size:12px}th,td{padding:7px 8px}.stat b{font-size:21px}header{background:#111;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.nav{padding:10px;display:flex;gap:7px;flex-wrap:wrap;background:#fff;position:sticky;top:0;z-index:5}.nav button,.btn{padding:10px 13px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.primary{background:#111;color:#fff}.ok{background:#176b3a;color:#fff}.danger{background:#b42318;color:#fff}.warn{background:#c98a00;color:#fff}main{max-width:1250px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat,.card{background:#fff;border-radius:13px;padding:16px;box-shadow:0 2px 10px #0001}.stat b{font-size:25px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.input{padding:10px;border:1px solid #ddd;border-radius:8px;margin:3px;box-sizing:border-box}.login{max-width:360px;margin:80px auto}.row{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}.sold{background:#fee;color:#b42318}.available{background:#efe;color:#176b3a}.thumb{width:58px;height:48px;object-fit:cover;border-radius:8px;background:#eee}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:#fff;border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.preview{width:150px;height:120px;object-fit:cover;border-radius:10px;background:#eee;display:block;margin:8px 0}.hint{font-size:12px;color:#666}.orders- -text)}.hint{color:var(--muted)}/* Elegant sparkle finish */body{background:radial-gradient(ellipse at 12% 0%,rgba(214,185,145,.22),transparent 36%),linear-gradient(135deg,#f8f2e8,#f2e8d9);background-attachment:fixed}header{position:relative;overflow:hidden;background:linear-gradient(110deg,#321b0f 0%,#5b351f 54%,#7a4b2a 100%);box-shadow:0 8px 24px rgba(50,27,15,.22)}header:after{content:"✦";position:absolute;right:26%;top:4px;color:rgba(255,245,220,.76);font-size:18px;text-shadow:0 0 12px #f8e2b2;animation:adminSparkle 3.2s ease-in-out infinite;pointer-events:none}.nav{backdrop-filter:blur(12px);background:rgba(255,253,248,.92)}.nav button,.btn{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(91,53,31,.14)}.stat,.card,.modalbox{border-radius:15px;box-shadow:0 5px 18px rgba(72,44,26,.07),0 1px 2px rgba(72,44,26,.05)}.stat:hover{box-shadow:0 8px 24px rgba(72,44,26,.12)}h2,h3{color:#4a2b1b}.orders-table th{background:linear-gradient(180deg,#fffdf8,#f8f2e8)}.order-status{border:1px solid #eadfce;background:#f8f2e8;color:#5b351f}.order-icon{box-shadow:0 2px 6px rgba(72,44,26,.12);transition:transform .16s ease,box-shadow .16s ease}.order-icon:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 4px 10px rgba(72,44,26,.2)}@keyframes adminSparkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.16) rotate(22deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}/* Show the full supplied café artwork behind the Admin dashboard */body{background-color:#f4efe7;background-image:linear-gradient(rgba(248,242,232,.16),rgba(248,242,232,.22)),url("assets/admin-background.png");background-position:center,center;background-size:cover,contain;background-repeat:no-repeat;background-attachment:fixed,fixed}.stat,.card{background:rgba(255,253,248,.84)}table{background:rgba(255,253,248,.9)}.nav{background:rgba(255,253,248,.88)}.rider-filter-label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--brown)}.rider-filter-field{box-sizing:border-box;width:170px;height:40px;margin:0;font:inherit;font-size:12px}.rider-record-date{font-size:12px;white-space:nowrap}.order-filter-label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--brown)}.order-filter-field{box-sizing:border-box;width:min(320px,100%);min-width:190px;height:40px;margin:0;font:inherit;font-size:12px}.sales-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sales-stat{padding:11px 12px;font-size:11px;line-height:1.35;border-radius:11px}.sales-stat b{display:inline-block;margin-top:5px;font-size:17px}.sales-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:12px;padding:14px;border-radius:12px}.sales-details h3{font-size:13px;margin:0 0 7px}.sales-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px}.sales-line:last-child{border-bottom:0}.sales-line b{font-size:11px;white-space:nowrap}@media(max-width:650px){.sales-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sales-details{grid-template-columns:1fr}}.sales-chart{margin-top:12px;padding:14px;border-radius:12px}.sales-chart-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.sales-chart-heading h3{font-size:13px;margin:0 0 8px}.sales-chart-heading span{font-size:10px;color:var(--muted)}.sales-chart-scroll{overflow-x:auto}.sales-chart-scroll svg{display:block;max-width:100%;height:auto}.suki-id-card{box-sizing:border-box;position:relative;overflow:hidden;width:min(100%,430px);aspect-ratio:1.586;margin:18px 0 10px;padding:clamp(16px,4vw,24px);border-radius:18px;color:#fff8e8;background:radial-gradient(circle at 92% 12%,rgba(239,204,145,.3),transparent 27%),linear-gradient(135deg,#321b0f,#6b3c20 65%,#a77842);box-shadow:0 12px 28px rgba(50,27,15,.25)}.suki-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(10px,2.4vw,13px);letter-spacing:.8px}.suki-card-top span{font-size:clamp(7px,1.8vw,9px);letter-spacing:1.2px;opacity:.82}.suki-card-title{margin-top:clamp(8px,2vw,12px);font-size:clamp(9px,2vw,11px);letter-spacing:2px;color:#efcc91}.suki-member-name{margin-top:5px;font-size:clamp(15px,4vw,21px);font-weight:bold;text-transform:uppercase;overflow-wrap:anywhere}.suki-member-contact{font-size:clamp(9px,2vw,11px);opacity:.85;margin-top:2px}.suki-member-id{margin-top:clamp(10px,2.5vw,16px);display:flex;flex-direction:column;gap:3px}.suki-member-id small{font-size:8px;letter-spacing:1.5px;opacity:.8}.suki-member-id strong{font-size:clamp(12px,3vw,16px);letter-spacing:2px}.suki-expiry{font-size:7px!important;letter-spacing:1px!important;margin-top:2px}.suki-card-footer{position:absolute;right:clamp(16px,4vw,24px);bottom:clamp(13px,3vw,19px);font-size:8px;opacity:.85} .suki-member-table-scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}.suki-member-table-scroll thead th{position:sticky;top:0;z-index:2;background:var(--cream)}.suki-member-table-scroll table{min-width:900px}.suki-member-name-cell{min-width:130px;max-width:185px;font-size:11px;line-height:1.3;overflow-wrap:anywhere}.daily-report-layout{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);gap:12px;align-items:start}.daily-report-stats{position:sticky;top:72px}.daily-report-stats h3{margin:0 0 10px}.daily-report-stat{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.daily-report-stat:last-child{border-bottom:0}.daily-report-stat b{display:block;margin-top:4px;font-size:17px;color:var(--brown)}.daily-report-main{min-width:0}@media(max-width:800px){.daily-report-layout{grid-template-columns:1fr}.daily-report-stats{position:static}.daily-report-stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}}</style></head><body><header><div style="display:flex;align-items:center;gap:10px"><img src="assets/foodtraps-logo.png" alt="" style="width:72px;height:42px;object-fit:contain;background:#fff8ed;border-radius:7px;padding:3px"><div><b>FOOD TRAPS CAFÉ</b><div>ADMIN DASHBOARD</div></div></div><button class="btn" onclick="logout()">LOGOUT</button></header><div id="app"></div><script>
let deliveryMap=null,deliveryMapMarker=null,deliveryMapPickerBusy=false;
let user='',riderDeliveryRows=[],adminOrderCache=[],adminOrderSearch='',adminOrderDate='',sukiCardRows=[],sukiCardVisibleRows=[],sukiCardSearch='',sukiPointsHistoryRows=[],sukiPointsHistorySearch='';
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₱'+Number(n||0).toFixed(2)}
function login(){app.innerHTML='<div class="card login"><img src="assets/foodtraps-logo.png" alt="Foodtraps Café" style="display:block;width:150px;height:84px;object-fit:contain;margin:0 auto 12px"><h2>Admin Login</h2><input id="u" class="input" value="admin" placeholder="Username"><input id="p" class="input" type="password" placeholder="PIN"><button class="btn primary" onclick="doLogin()">LOGIN</button><button id="localTestLoginButton" class="btn" style="width:100%;margin-top:8px" data-role="ADMIN" onclick="quickLocalTestLogin(this.dataset.role)">LOCAL TEST ACCESS</button></div>';if(!isLocalTestHost())$('localTestLoginButton')?.remove()}
function isLocalTestHost(){return ['localhost','127.0.0.1','::1'].includes(location.hostname.toLowerCase())}
function quickLocalTestLogin(role){google.script.run.withSuccessHandler(r=>{user=r.username;boot()}).withFailureHandler(e=>alert(e.message||e)).startLocalTestSession(role)}
function doLogin(){google.script.run.withSuccessHandler(r=>{if(!r.ok)return alert(r.message);user=r.username;boot()}).withFailureHandler(e=>alert(e.message||e)).loginStaff($('u').value,$('p').value,'ADMIN')}
function endAdminSession(){user='';google.script.run.withSuccessHandler(login).withFailureHandler(login).logoutStaff()}
function restoreAdminSession(){google.script.run.withSuccessHandler(r=>{if(r&&r.role==='ADMIN'){user=r.username;boot()}else login()}).withFailureHandler(login).getStaffSession()}
function adminApi(method,...args){return fetch('api.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,args})}).then(async response=>{const result=await response.json();if(!response.ok||result&&result.error)throw new Error(result.error||'Request failed');return result})}
function branding(){content.innerHTML='<section class="card" style="max-width:860px"><h2>Company Branding & Appearance</h2><p class="hint">Set the name and logo, then choose the look used throughout the system.</p><label>Company name<input id="brandName" class="input" maxlength="80" style="width:100%"></label><label>Tagline<input id="brandTagline" class="input" maxlength="160" style="width:100%"></label><label>Store address · delivery starting point<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="deliveryStartAddress" class="input" maxlength="300" placeholder="Enter the store pickup address" style="flex:1;min-width:230px"><button class="btn" type="button" onclick="openDeliveryMapPicker()">📍 Pick on map</button></div><span class="hint">Pick or search for the store on the map to fill in its address. Rider map directions will start here.</span></label><label>Google Maps API key<input id="brandGoogleMapsApiKey" class="input" type="password" autocomplete="new-password" maxlength="512" placeholder="Enter your Google Maps browser key" style="width:100%"><span class="hint">Used for interactive maps. Restrict this browser key to your app’s website address in Google Cloud.</span></label><label>Company logo (PNG, JPG, or WebP; up to 2 MB)<input id="brandLogoFile" class="input" type="file" accept="image/png,image/jpeg,image/webp" style="width:100%" onchange="previewBrandLogo(this)"></label><div style="display:flex;align-items:center;gap:14px;margin:12px 0"><img id="brandLogoPreview" alt="Company logo preview" style="width:150px;height:90px;object-fit:contain;background:#f4f5f7;border:1px solid #ddd;border-radius:8px;padding:8px"><span class="hint">Current logo preview</span></div><hr><h3>System Appearance</h3><label>Background image (PNG, JPG, or WebP; up to 2 MB)<input id="brandBackgroundFile" class="input" type="file" accept="image/png,image/jpeg,image/webp" style="width:100%" onchange="previewBrandBackground(this)"></label><div style="display:flex;align-items:center;gap:14px;margin:12px 0"><img id="brandBackgroundPreview" alt="System background preview" style="width:200px;height:90px;object-fit:cover;background:#f4f5f7;border:1px solid #ddd;border-radius:8px;padding:4px"><span class="hint">Current background preview</span></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><label>Primary system color<input id="brandPrimaryColor" class="input" type="color" style="width:100%;height:44px"></label><label>Page background color<input id="brandPageColor" class="input" type="color" style="width:100%;height:44px"></label><label>Font family<select id="brandFontFamily" class="input" style="width:100%"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Tahoma">Tahoma</option><option value="Trebuchet MS">Trebuchet MS</option><option value="system-ui">System</option></select></label><label>Base text size<select id="brandFontSize" class="input" style="width:100%"><option value="13">Small · 13 px</option><option value="15">Medium · 15 px</option><option value="17">Large · 17 px</option></select></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="saveBrandButton" onclick="saveBranding()">Save Branding & Appearance</button><button class="btn" onclick="resetBrandLogo()">Restore Original Logo</button><button class="btn" onclick="resetBrandBackground()">Remove Background Image</button></div></section>';loadBranding()}
function loadLeaflet(){if(window.L)return Promise.resolve();if(window.deliveryLeafletPromise)return window.deliveryLeafletPromise;window.deliveryLeafletPromise=new Promise((resolve,reject)=>{if(!document.getElementById('leaflet-css')){const css=document.createElement('link');css.id='leaflet-css';css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css)}const script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=()=>reject(new Error('The map could not load. Check your internet connection and try again.'));document.head.appendChild(script)});return window.deliveryLeafletPromise}
function openDeliveryMapPicker(){if(!$('deliveryMapModal')){const modal=document.createElement('div');modal.id='deliveryMapModal';modal.className='modal';modal.style.zIndex='100';modal.innerHTML='<section class="modalbox" style="width:min(900px,100%);max-height:94vh"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0">Choose store location</h2><p class="hint" style="margin:5px 0 10px">Search for the store, or click and drag the pin. The address will fill in automatically.</p></div><button class="btn" onclick="closeDeliveryMapPicker()">CLOSE</button></div><div class="row" style="margin-bottom:9px"><input id="deliveryMapSearch" class="input" style="flex:1;min-width:210px" placeholder="Search a place or address" onkeydown="if(event.key===\'Enter\'){event.preventDefault();searchDeliveryMapPlace()}"><button class="btn primary" onclick="searchDeliveryMapPlace()">SEARCH</button></div><div id="deliveryMapCanvas" style="height:min(55vh,480px);min-height:300px;border-radius:10px;border:1px solid var(--line);z-index:0"></div><div id="deliveryMapStatus" class="hint" style="min-height:20px;margin-top:8px">Loading map…</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" onclick="useDeliveryMapAddress()">USE THIS ADDRESS</button></div></section>';modal.addEventListener('click',e=>{if(e.target===modal)closeDeliveryMapPicker()});document.body.appendChild(modal)}$('deliveryMapModal').style.display='flex';$('deliveryMapStatus').textContent='Loading map…';loadLeaflet().then(()=>{if(!deliveryMap)initDeliveryMap([12.8797,121.774]);else setTimeout(()=>deliveryMap.invalidateSize(),100)}).catch(e=>{$('deliveryMapStatus').textContent=e.message})}
function initDeliveryMap(center){if(!window.L)return;deliveryMap=L.map('deliveryMapCanvas').setView(center,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(deliveryMap);deliveryMap.on('click',e=>setDeliveryMapPin(e.latlng));$('deliveryMapStatus').textContent='Click the map or drag the pin to the store entrance.';const existing=String($('deliveryStartAddress')?.value||'').trim();if(existing)geocodeDeliveryPlace(existing,false);else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{if(deliveryMap&&!deliveryMapMarker){deliveryMap.setView([pos.coords.latitude,pos.coords.longitude],16)}},()=>{}, {timeout:2500,maximumAge:300000})}
function closeDeliveryMapPicker(){const modal=$('deliveryMapModal');if(modal)modal.style.display='none'}
function setDeliveryMapPin(latlng){const point=[Number(latlng.lat),Number(latlng.lng)];if(!deliveryMapMarker)deliveryMapMarker=L.marker(point,{draggable:true}).addTo(deliveryMap).on('dragend',()=>reverseGeocodeDeliveryPin());else deliveryMapMarker.setLatLng(point);deliveryMap.panTo(point);reverseGeocodeDeliveryPin()}
async function reverseGeocodeDeliveryPin(){if(!deliveryMapMarker||deliveryMapPickerBusy)return;deliveryMapPickerBusy=true;$('deliveryMapStatus').textContent='Finding the address…';const p=deliveryMapMarker.getLatLng();try{const response=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat='+encodeURIComponent(p.lat)+'&lon='+encodeURIComponent(p.lng),{headers:{'Accept':'application/json'}});if(!response.ok)throw new Error();const result=await response.json();const address=String(result.display_name||'').slice(0,300);if(address){$('deliveryMapSearch').value=address;$('deliveryMapStatus').textContent='Address found. Select “Use this address” to save it.'}else $('deliveryMapStatus').textContent='No street address found here. You can still search or enter an address manually.'}catch(e){$('deliveryMapStatus').textContent='Could not look up an address. Try searching by place name or enter the address manually.'}finally{deliveryMapPickerBusy=false}}
async function geocodeDeliveryPlace(query,showErrors=true){if(!query.trim())return;$('deliveryMapStatus').textContent='Searching…';try{const response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(query),{headers:{'Accept':'application/json'}});if(!response.ok)throw new Error('Search is temporarily unavailable.');const rows=await response.json();if(!rows.length)throw new Error('No matching place was found.');const place=rows[0];deliveryMap.setView([Number(place.lat),Number(place.lon)],17);setDeliveryMapPin({lat:Number(place.lat),lng:Number(place.lon)});$('deliveryMapSearch').value=String(place.display_name||query).slice(0,300);$('deliveryMapStatus').textContent='Place found. Select “Use this address” to save it.'}catch(e){if(showErrors)$('deliveryMapStatus').textContent=e.message||'Could not search. Try a more complete address.'}}
function searchDeliveryMapPlace(){geocodeDeliveryPlace(String($('deliveryMapSearch')?.value||''))}
function useDeliveryMapAddress(){const address=String($('deliveryMapSearch')?.value||'').trim();if(!address)return alert('Choose a map location or search for an address first.');$('deliveryStartAddress').value=address.slice(0,300);closeDeliveryMapPicker()}
function loadBranding(){adminApi('getPublicStaffConfig').then(r=>{if(!r)return;$('brandName').value=r.businessName||'';$('brandTagline').value=r.tagline||'';$('deliveryStartAddress').value=r.deliveryStartAddress||'';$('brandLogoPreview').src=r.logoUrl||'';$('brandBackgroundPreview').src=r.backgroundUrl||'';$('brandBackgroundPreview').style.display=r.backgroundUrl?'block':'none';$('brandPrimaryColor').value=r.primaryColor||'#5b351f';$('brandPageColor').value=r.pageColor||'#f4efe7';$('brandFontFamily').value=r.fontFamily||'Arial';$('brandFontSize').value=String(r.fontSize||15)}).catch(e=>alert(e.message||e));adminApi('getGoogleMapsApiKey').then(r=>{if($('brandGoogleMapsApiKey'))$('brandGoogleMapsApiKey').value=r.apiKey||''}).catch(e=>alert(e.message||e))}
function previewBrandFile(input,previewId){const file=input.files&&input.files[0];if(!file)return;if(file.size>2*1024*1024){input.value='';return alert('The image must be 2 MB or smaller.')}const reader=new FileReader();reader.onload=()=>{const preview=$(previewId);preview.src=reader.result;preview.style.display='block'};reader.readAsDataURL(file)}function previewBrandLogo(input){previewBrandFile(input,'brandLogoPreview')}function previewBrandBackground(input){previewBrandFile(input,'brandBackgroundPreview')}
async function saveBranding(resetLogo=false,resetBackground=false){const name=$('brandName').value.trim(),tagline=$('brandTagline').value.trim(),logoFile=$('brandLogoFile').files[0],backgroundFile=$('brandBackgroundFile').files[0],button=$('saveBrandButton');if(!name)return alert('Enter a company name.');const readFile=file=>new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>2*1024*1024)return reject(new Error('Images must be 2 MB or smaller.'));const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('An image could not be read.'));reader.readAsDataURL(file)});let logo='',background='';try{logo=resetLogo?'':await readFile(logoFile);background=resetBackground?'':await readFile(backgroundFile)}catch(e){return alert(e.message||e)}const theme={backgroundData:background,resetBackground,primaryColor:$('brandPrimaryColor').value,pageColor:$('brandPageColor').value,fontFamily:$('brandFontFamily').value,fontSize:Number($('brandFontSize').value),deliveryStartAddress:$('deliveryStartAddress').value.trim(),googleMapsApiKey:$('brandGoogleMapsApiKey').value.trim()};button.disabled=true;button.textContent='SAVING…';try{const result=await adminApi('saveBrandSettings',name,tagline,logo,resetLogo,theme);window.applyBrandSettings?.(result);$('brandLogoPreview').src=result.logoUrl;$('brandBackgroundPreview').src=result.backgroundUrl||'';$('brandBackgroundPreview').style.display=result.backgroundUrl?'block':'none';$('brandLogoFile').value='';$('brandBackgroundFile').value='';alert('Company branding and appearance saved.')}catch(e){alert(e.message||e)}finally{button.disabled=false;button.textContent='Save Branding & Appearance'}}

table><thead><tr><th>Date</th><th>Time</th><th>Member / Card</th><th>Activity</th><th>Points change</th><th>Items</th><th>Qty</th><th>Balance after</th><th>Order</th><th>Recorded by</th></tr></thead><tbody id="sukiPointsHistoryRows"><tr><td colspan="10">Loading…</td></tr></tbody></table></div></div>`;google.script.run.withSuccessHandler(rows=>{sukiCardRows=rows||[];renderSukiCardRows()}).withFailureHandler(e=>alert(e.message||e)).getSukiCards();loadSukiPointsHistory()}
function loadSukiPointsHistory(){const body=$('sukiPointsHistoryRows');if(body)body.innerHTML='<tr><td colspan="10">Loading…</td></tr>';google.script.run.withSuccessHandler(rows=>{sukiPointsHistoryRows=rows||[];renderSukiPointsHistory()}).withFailureHandler(e=>{if(body)body.innerHTML=`<tr><td colspan="10">Unable to load points history: ${esc(e.message||e)}</td></tr>`}).getSukiPointsHistory('')}

function filterAdminOrders(){
 const term=String($('adminOrderSearch')?.value??adminOrderSearch).trim().toLowerCase(),date=$('adminOrderDate')?.value??adminOrderDate;
 adminOrderSearch=term;adminOrderDate=date;
 const rows=adminOrderCache.filter(o=>{const haystack=[o.orderNumber,o.customerName,o.contactNumber,o.orderType,o.status,...(o.items||[]).map(i=>i.itemName)].join(' ').toLowerCase();return(!term||haystack.includes(term))&&(!date||String(o.date||'')===date)});
 const body=$('adminOrderRows');if(!body)return;
 body.innerHTML=rows.length?rows.map(o=>{const items=(o.items||[]).map(i=>`${esc(i.itemName)} ×${Number(i.quantity)||1}`).join(', ')||'—';return `<tr><td><b>${esc(o.orderNumber)}</b><small>${esc(o.date||'')} ${esc(o.time||'')}</small></td><td>${esc(o.customerName)}<small>${esc(o.contactNumber||'')}</small></td><td>${esc(o.orderType||'')}</td><td class="order-items">${items}</td><td><b>${money(o.total)}</b></td><td><span class="order-status">${esc(o.status)}</span></td><td><div class="order-actions"><button class="order-icon ok" title="Mark ready" aria-label="Mark ready" onclick="status('${esc(o.orderNumber)}','READY')">✓</button><button class="order-icon warn" title="Complete order" aria-label="Complete order" onclick="status('${esc(o.orderNumber)}','COMPLETED')">▣</button><button class="order-icon danger" title="Cancel order" aria-label="Cancel order" onclick="status('${esc(o.orderNumber)}','CANCELLED')">×</button></div></td></tr>`}).join(''):'<tr><td colspan="7" style="padding:12px">No matching orders.</td></tr>';
 const count=$('adminOrderCount');if(count)count.textContent=`Showing ${rows.length} of ${adminOrderCache.length} orders`;
}

let adminMenuCache=[];
let adminMenuSearch='';
function menu(){google.script.run.withSuccessHandler(a=>{adminMenuCache=a||[];renderAdminMenu()}).withFailureHandler(e=>alert(e.message||e)).getAdminMenu()}
function renderAdminMenu(){
 const active=document.activeElement;
 const wasSearching=active&&active.id==='menuSearch';
 const selectionStart=wasSearching?active.selectionStart:0;
 const selectionEnd=wasSearching?active.selectionEnd:0;
 const q=adminMenuSearch.trim();
 const query=q.toLowerCase();
 const list=adminMenuCache.filter(m=>!query || [m.id,m.category,m.name,String(m.price),m.available?'available':'sold out',m.pointsEnabled?'points enabled':'points disabled',m.pointsPerItem,m.pointsExpiresOn,m.redeemEnabled?'suki redemption eligible':'redemption disabled',m.privilegeDiscountEligible?'5% privilege eligible':'privilege discount disabled'].some(v=>String(v??'').toLowerCase().includes(query)));
 content.innerHTML='<h2>Menu Management</h2><div class="card"><div class="row" style="align-items:center;margin-bottom:10px"><button class="btn primary" onclick="openMenuEditor()">+ Add Menu Item</button><input id="menuSearch" class="input" style="flex:1;min-width:240px" placeholder="Search menu by name, ID, category, price, points, redemption, or status..." value="'+esc(adminMenuSearch)+'" oninput="adminMenuSearch=this.value;renderAdminMenu()"></div><p class="hint">Turn on a limited-time Suki points offer for chosen items, set points per item, and choose an end date. You can also mark menu items eligible for Suki redemption (10 points = ₱1) or a 5% privilege discount. Redemption only discounts eligible items. Active Suki members earn promo points when discounted food subtotal is at least ₱1,000. Sold-out items remain visible but cannot be added to the cart.</p><div class="hint" style="margin-bottom:8px">Showing '+list.length+' of '+adminMenuCache.length+' menu items.</div><div class="menu-table-scroll"><table class="menu-table"><tr><th>Picture</th><th>ID</th><th>Category</th><th>Name</th><th>Price</th><th>Availability</th><th>Suki Points</th><th>Suki Redemption</th><th>5% Privilege</th><th>Actions</th></tr>'+list.map(m=>`<tr><td>${m.image?`<img class="thumb" src="${esc(m.image)}" onerror="this.style.display='none'">`:'—'}</td><td>${esc(m.id)}</td><td>${esc(m.category)}</td><td>${esc(m.name)}</td><td>${money(m.price)}</td><td class="${m.available?'available':'sold'}"><b>${m.available?'AVAILABLE':'SOLD OUT'}</b></td><td>${m.pointsEnabled?`${!m.pointsExpiresOn?'END DATE NEEDED · ':m.pointsExpiresOn<new Date(new Date().getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)?'EXPIRED · ':''}+${Number(m.pointsPerItem||0)} per item · until ${esc(m.pointsExpiresOn||'—')}`:'—'}</td><td>${m.redeemEnabled?'<b>ELIGIBLE</b>':'—'}</td><td>${m.privilegeDiscountEligible?'<b>ELIGIBLE</b>':'—'}</td><td><div style="display:flex;gap:3px;flex-wrap:nowrap;align-items:center"><button class="btn" style="padding:5px 7px;font-size:9px;white-space:nowrap" onclick='editMenu(${JSON.stringify(m).replace(/'/g,"&#39;")})'>EDIT</button><button class="btn" style="padding:5px 7px;font-size:9px;white-space:nowrap" onclick="toggle('${esc(m.id)}',${!m.available})">${m.available?'SOLD OUT':'AVAILABLE'}</button><button class="btn danger" style="padding:5px 7px;font-size:9px;white-space:nowrap" onclick="del('${esc(m.id)}')">DELETE</button></div></td></tr>`).join('')+'</table></div></div>';
 const inp=$('menuSearch'); if(inp&&wasSearching){inp.focus();inp.setSelectionRange(selectionStart,selectionEnd)}
}

function toggle(id,v){google.script.run.withSuccessHandler(menu).markMenuAvailability(id,v,user)}function del(id){if(confirm('Delete this menu item?'))google.script.run.withSuccessHandler(menu).deleteMenuItem(id,user)}
function openMenuEditor(m){m=m||{id:'',category:'Other',name:'',price:0,available:true,image:'',pointsEnabled:false,pointsPerItem:0,pointsExpiresOn:'',redeemEnabled:false,privilegeDiscountEligible:false};content.insertAdjacentHTML('beforeend',`<div class="modal" id="menuModal"><div class="modalbox"><h2>${m.id?'Edit Menu Item':'Add Menu Item'}</h2><input id="mi_id" class="input" style="width:100%" value="${esc(m.id)}" placeholder="ID" ${m.id?'readonly':''}><input id="mi_cat" class="input" style="width:100%" value="${esc(m.category)}" placeholder="Category"><input id="mi_name" class="input" style="width:100%" value="${esc(m.name)}" placeholder="Item name"><input id="mi_price" class="input" style="width:100%" type="number" step="0.01" value="${Number(m.price)||0}" placeholder="Price"><label style="display:block;margin:10px 0"><input id="mi_avail" type="checkbox" ${m.available?'checked':''}> Available for ordering</label><div class="card" style="padding:12px;margin:10px 0"><label><input id="mi_redeemEnabled" type="checkbox" ${m.redeemEnabled?'checked':''}> Eligible for Suki point redemption (10 points = ₱1)</label><div class="hint">Only points discounts from eligible menu items can be redeemed at Front Desk.</div><label style="display:block;margin-top:8px"><input id="mi_privilegeDiscountEligible" type="checkbox" ${m.privilegeDiscountEligible?'checked':''}> Eligible for 5% privilege discount</label><div class="hint">Enable only for items approved by your store policy. VAT remains included.</div><hr><label><input id="mi_pointsEnabled" type="checkbox" ${m.pointsEnabled?'checked':''} onchange="toggleMenuPointsInput()"> Earn Suki Card points</label><label style="display:block;margin-top:8px">Points per item<input id="mi_pointsPerItem" class="input" style="width:100%" type="number" min="1" max="10000" step="1" value="${Number(m.pointsPerItem)||''}" placeholder="e.g. 5" ${m.pointsEnabled?'':'disabled'}></label><label style="display:block;margin-top:8px">Offer expires on<input id="mi_pointsExpiresOn" class="input" style="width:100%" type="date" value="${esc(m.pointsExpiresOn||'')}" ${m.pointsEnabled?'required':'disabled'}></label><div class="hint">The item offer ends on this date. Active Suki members earn points on qualifying Front Desk orders.</div></div><div><img id="mi_preview" class="preview" src="${esc(m.image||'')}" ${m.image?'':'style="display:none"'}></div><input id="mi_file" class="input" style="width:100%" type="file" accept="image/jpeg,image/png,image/webp,image/gif" onchange="previewImage(event)"><div class="hint">Picture max 5 MB. Upload after saving the menu item.</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveEditedMenu()">SAVE</button><button class="btn" onclick="closeMenuEditor()">CANCEL</button></div></div></div>`)}
function toggleMenuPointsInput(){const enabled=$('mi_pointsEnabled').checked,points=$('mi_pointsPerItem'),expiry=$('mi_pointsExpiresOn');if(points)points.disabled=!enabled;if(expiry){expiry.disabled=!enabled;expiry.required=enabled}}function editMenu(m){openMenuEditor(m)}function closeMenuEditor(){const x=$('menuModal');if(x)x.remove()}
function previewImage(e){const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Image must be 5 MB or smaller.');e.target.value='';return}const r=new FileReader();r.onload=()=>{$('mi_preview').src=r.result;$('mi_preview').style.display='block'};r.readAsDataURL(f)}
function saveEditedMenu(){const item={id:$('mi_id').value.trim(),category:$('mi_cat').value.trim()||'Other',name:$('mi_name').value.trim(),price:Number($('mi_price').value)||0,available:$('mi_avail').checked,pointsEnabled:$('mi_pointsEnabled').checked,pointsPerItem:Number($('mi_pointsPerItem').value)||0,pointsExpiresOn:$('mi_pointsExpiresOn').value,redeemEnabled:$('mi_redeemEnabled').checked,privilegeDiscountEligible:$('mi_privilegeDiscountEligible').checked};if(!item.name)return alert('Item name is required.');if(item.pointsEnabled&&(!Number.isInteger(item.pointsPerItem)||item.pointsPerItem<1||item.pointsPerItem>10000))return alert('Enter points per item from 1 to 10,000, or turn off Suki points.');if(item.pointsEnabled&&!item.pointsExpiresOn)return alert('Choose an end date for this Suki points offer.');const f=$('mi_file').files[0];google.script.run.withSuccessHandler(()=>{if(f){const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(()=>{closeMenuEditor();menu()}).withFailureHandler(e=>alert(e.message||e)).uploadMenuImage(r.result,f.name,f.type,item.id,user);r.readAsDataURL(f)}else{closeMenuEditor();menu()}}).withFailureHandler(e=>alert(e.message||e)).saveMenuItem(item,user)}
function reports(){google.script.run.withSuccessHandler(r=>{const avg=r.orders?Number(r.gross)/Number(r.orders):0,days=(r.dailySales||[]).length;content.innerHTML=`<div class="sales-report"><h2>Sales Report Daily</h2><div class="daily-report-layout"><aside class="card daily-report-stats"><h3>Statistics</h3><div class="daily-report-stats-grid"><div class="daily-report-stat">Orders<b>${Number(r.orders)||0}</b></div><div class="daily-report-stat">Gross Sales<b>${money(r.gross)}</b></div><div class="daily-report-stat">Average Order<b>${money(avg)}</b></div><div class="daily-report-stat">Discounts<b>${money(r.discounts)}</b></div><div class="daily-report-stat">Delivery Fees<b>${money(r.deliveryFees)}</b></div><div class="daily-report-stat">Sales Dates<b>${days}</b></div></div></aside><section class="daily-report-main"><div class="card sales-chart"><div class="sales-chart-heading"><h3>Daily Sales</h3><span>Last 14 sales dates</span></div><div id="dailySalesChart" class="sales-chart-scroll"></div></div><div class="card sales-chart"><div class="sales-chart-heading"><h3>Daily Summary</h3><span>Orders and average value by date</span></div><div id="dailySalesSummary" class="sales-chart-scroll"></div></div><div class="card sales-details"><section><h3>Payment Breakdown</h3>${Object.entries(r.byPayment||{}).map(x=>`<div class="sales-line"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div>`).join('')||'<p class="hint">No payment records.</p>'}</section><section><h3>Best Sellers</h3>${(r.bestItems||[]).map(x=>`<div class="sales-line"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<p class="hint">No item records.</p>'}</section></div></section></div></div>`;drawSalesChart(r.dailySales||[]);drawDailySalesSummary(r.dailySales||[])}).withFailureHandler(e=>alert(e.message||e)).getSalesReport('','')}
function drawDailySalesSummary(data){const box=$('dailySalesSummary');if(!box)return;if(!data.length){box.innerHTML='<p class="hint">No daily sales history yet.</p>';return}const rows=data.slice().reverse(),totalOrders=rows.reduce((sum,row)=>sum+Number(row.orders||0),0),totalSales=rows.reduce((sum,row)=>sum+Number(row.sales||0),0);box.innerHTML=`<table style="min-width:620px"><thead><tr><th>Date</th><th>Orders</th><th>Sales</th><th>Average order</th><th>Sales Percentage</th></tr></thead><tbody>${rows.map(row=>{const amount=Number(row.sales)||0,count=Number(row.orders)||0,share=totalSales?amount/totalSales*100:0;return `<tr><td>${esc(row.date)}</td><td>${count}</td><td><b>${money(amount)}</b></td><td>${money(count?amount/count:0)}</td><td>${share.toFixed(1)}%</td></tr>`}).join('')}<tr><th>Last ${rows.length} sales dates</th><th>${totalOrders}</th><th>${money(totalSales)}</th><th>${money(totalOrders?totalSales/totalOrders:0)}</th><th>100%</th></tr></tbody></table>`}
function drawSalesChart(data){
 const box=$('dailySalesChart');if(!box)return;if(!data.length){box.innerHTML='<p class="hint">No sales history to chart yet.</p>';return}
 const width=Math.max(560,data.length*52+70),height=250,left=58,right=14,top=14,bottom=42,chartW=width-left-right,chartH=height-top-bottom,max=Math.max(...data.map(x=>Number(x.sales)||0),1),slot=chartW/data.length,barW=Math.min(28,slot*.58);
 let svg=`<svg role="img" aria-label="Daily sales bar chart for the last 14 sales dates" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="salesBar" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#9a6a43"/><stop offset="100%" stop-color="#5b351f"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const value=max*i/4,y=top+chartH-(chartH*i/4);svg+=`<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#eadfce" stroke-width="1"/><text x="${left-7}" y="${y+3}" text-anchor="end" fill="#85776c" font-size="9">${esc(Math.round(value).toLocaleString('en-PH'))}</text>`}
 data.forEach((item,i)=>{const sales=Number(item.sales)||0,bh=chartH*sales/max,x=left+slot*i+(slot-barW)/2,y=top+chartH-bh,date=String(item.date||''),d=date.match(/^(\d{4})-(\d{2})-(\d{2})$/),label=d?`${d[2]}/${d[3]}`:date;svg+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="url(#salesBar)"><title>${esc(date)} · ${money(sales)} · ${Number(item.orders)||0} orders</title></rect><text x="${x+barW/2}" y="${height-17}" text-anchor="middle" fill="#6d5747" font-size="9">${esc(label)}</text>`});
 svg+='</svg>';box.innerHTML=svg;
}

function monthlyReports(){google.script.run.withSuccessHandler(r=>{content.innerHTML=`<div class="sales-report"><h2>Sales Report Monthly</h2><div class="cards sales-cards"><div class="stat sales-stat">Orders<br><b>${r.orders}</b></div><div class="stat sales-stat">Gross Sales<br><b>${money(r.gross)}</b></div><div class="stat sales-stat">Discounts<br><b>${money(r.discounts)}</b></div><div class="stat sales-stat">Delivery Fees<br><b>${money(r.deliveryFees)}</b></div></div><div class="card sales-chart"><div class="sales-chart-heading"><h3>Monthly Sales</h3><span>Last 12 months</span></div><div id="monthlySalesChart" class="sales-chart-scroll"></div></div><div class="card sales-details"><section><h3>Payment Breakdown</h3>${Object.entries(r.byPayment).map(x=>`<div class="sales-line"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div>`).join('')||'<p class="hint">No payment records.</p>'}</section><section><h3>Best Sellers</h3>${r.bestItems.map(x=>`<div class="sales-line"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<p class="hint">No item records.</p>'}</section></div><div class="card sales-chart"><div class="sales-chart-heading"><h3>Top Best-Selling Items</h3><span>Items sold</span></div><div id="topSellerChart" class="sales-chart-scroll"></div></div></div>`;drawMonthlySalesChart(r.monthlySales||[]);drawTopSellerChart(r.bestItems||[])}).withFailureHandler(e=>alert(e.message||e)).getSalesReport('','')}
function drawTopSellerChart(data){
 const box=$('topSellerChart');if(!box)return;data=(data||[]).slice(0,10);if(!data.length){box.innerHTML='<p class="hint">No item sales history to chart yet.</p>';return}
 const width=720,rowH=32,left=190,right=55,top=12,height=top+data.length*rowH+10,chartW=width-left-right,max=Math.max(...data.map(x=>Number(x[1])||0),1);
 let svg=`<svg role="img" aria-label="Top 10 best-selling items by quantity sold" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="topSellerBar" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#c99a66"/><stop offset="100%" stop-color="#7a4b2a"/></linearGradient></defs>`;
 data.forEach((item,i)=>{const label=String(item[0]||''),qty=Number(item[1])||0,y=top+i*rowH+4,bw=chartW*qty/max;svg+=`<text x="${left-10}" y="${y+15}" text-anchor="end" fill="#6d5747" font-size="11">${esc(label.length>28?label.slice(0,26)+'…':label)}</text><rect x="${left}" y="${y}" width="${bw}" height="20" rx="5" fill="url(#topSellerBar)"><title>${esc(label)} · ${qty} sold</title></rect><text x="${left+bw+7}" y="${y+14}" fill="#6d5747" font-size="10">${qty}</text>`});svg+='</svg>';box.innerHTML=svg;
}
function drawMonthlySalesChart(data){
 const box=$('monthlySalesChart');if(!box)return;if(!data.length){box.innerHTML='<p class="hint">No monthly sales history to chart yet.</p>';return}
 const width=Math.max(560,data.length*58+70),height=250,left=58,right=14,top=14,bottom=42,chartW=width-left-right,chartH=height-top-bottom,max=Math.max(...data.map(x=>Number(x.sales)||0),1),slot=chartW/data.length,barW=Math.min(34,slot*.58);
 let svg=`<svg role="img" aria-label="Monthly sales bar chart for the last 12 months" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="monthlySalesBar" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c99a66"/><stop offset="100%" stop-color="#7a4b2a"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const value=max*i/4,y=top+chartH-(chartH*i/4);svg+=`<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#eadfce" stroke-width="1"/><text x="${left-7}" y="${y+3}" text-anchor="end" fill="#85776c" font-size="9">${esc(Math.round(value).toLocaleString('en-PH'))}</text>`}
 data.forEach((item,i)=>{const sales=Number(item.sales)||0,bh=chartH*sales/max,x=left+slot*i+(slot-barW)/2,y=top+chartH-bh,month=String(item.month||''),m=month.match(/^(\d{4})-(\d{2})$/),label=m?new Date(Number(m[1]),Number(m[2])-1,1).toLocaleDateString('en-PH',{month:'short',year:'2-digit'}):month;svg+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="url(#monthlySalesBar)"><title>${esc(month)} · ${money(sales)} · ${Number(item.orders)||0} orders</title></rect><text x="${x+barW/2}" y="${height-17}" text-anchor="middle" fill="#6d5747" font-size="9">${esc(label)}</text>`});
 svg+='</svg>';box.innerHTML=svg;
}

var staffRecordCache=[];let adminCashierDailyRows=[],adminCashierDailyName='',adminCashierDailyUser='',adminCashierDailyDate='';
function adminTodayIso(){const p=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function cashierDailyRecords(){content.innerHTML=`<h2>Cashier Daily Records</h2><p class="hint">Choose a cashier to view or print only the transactions recorded under their account.</p><div class="card">Loading cashier accounts…</div>`;google.script.run.withSuccessHandler(cashiers=>{const rows=cashiers||[];content.innerHTML=`<h2>Cashier Daily Records</h2><p class="hint">Each button opens records for that cashier only. Select the date before viewing.</p><div class="card"><label class="order-filter-label">Transaction date<input id="adminCashierRecordDate" type="date" class="input order-filter-field" value="${adminTodayIso()}"></label><div id="adminCashierButtons" class="cards" style="margin-top:12px">${rows.map(c=>`<div class="card"><b>${esc(c.fullName||c.username)}</b><div class="hint">${esc(c.username)}${c.active?'':' · INACTIVE'}</div><button class="btn primary" style="margin-top:10px" data-user="${esc(c.username)}" data-name="${esc(c.fullName||c.username)}" onclick="viewAdminCashierDailyRecords(this.dataset.user,this.dataset.name)">VIEW DAILY RECORDS</button></div>`).join('')||'<div class="card">No cashier accounts found.</div>'}</div></div><div id="adminCashierDailyResult" style="margin-top:14px"></div>`}).withFailureHandler(e=>{content.innerHTML=`<h2>Cashier Daily Records</h2><div class="card sold">${esc(e.message||e)}</div>`}).getCashiersForDailyRecords()}

function customers(){google.script.run.withSuccessHandler(a=>content.innerHTML='<h2>Customers</h2><table><tr><th>Name</th><th>Contact</th><th>Suki Card</th><th>Orders</th><th>Total</th><th>Last Order Date</th><th>Last Order Time</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.sukiCardNumber||'—')}</td><td>${x.orders}</td><td>${money(x.total)}</td><td>${esc(x.lastOrderDate||'—')}</td><td>${esc(x.lastOrderTime||'—')}</td></tr>`).join('')+'</table>').getCustomers()}
function riders(){google.script.run.withSuccessHandler(a=>{const states=['AVAILABLE','ASSIGNED','NOT AVAILABLE'];content.innerHTML=`<h2>Riders</h2><div class="card"><p class="hint">Manage rider availability and login credentials. Passwords are stored securely.</p><button class="btn primary" onclick="addRider()">+ Add Rider</button><div style="overflow:auto;margin-top:10px"><table><tr><th>ID</th><th>Name</th><th>Contact</th><th>Username</th><th>Status</th><th>Actions</th></tr>${a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.username||'—')}</td><td><select class="input" onchange="setRiderStatus('${esc(x.id)}',this.value)">${states.map(v=>`<option value="${v}" ${String(x.status).toUpperCase()===v?'selected':''}>${v==='NOT AVAILABLE'?'Not Available':v[0]+v.slice(1).toLowerCase()}</option>`).join('')}</select></td><td><button class="btn" onclick='editRider(${JSON.stringify(x).replace(/'/g,"&#39;")})'>EDIT</button> <button class="btn danger" onclick="delRider('${esc(x.id)}')">Delete</button></td></tr>`).join('')}</table></div></div>`}).withFailureHandler(e=>alert(e.message||e)).getRiders()}
function riderReport(){
 content.innerHTML='<h2>Riders Delivery Records</h2><div class="card">Loading rider report…</div>';
 google.script.run.withSuccessHandler(riders=>{
  google.script.run.withSuccessHandler(deliveries=>{

   const completed=list.reduce((sum,r)=>sum+Number(r.deliveryCount||0),0),amount=list.reduce((sum,r)=>sum+Number(r.deliveryAmount||0),0);

 }).withFailureHandler(e=>alert(e.message||e)).getRiders();
}
function formatRiderDeliveryDate(value){const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return esc(value||'—');return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'})}
function filterRiderDeliveryHistory(){
 const date=$('riderDeliveryDate')?.value||'',year=$('riderDeliveryYear')?.value||'';
 const rows=riderDeliveryRows.filter(o=>(!date||String(o.date||'')===date)&&(!year||String(o.date||'').slice(0,4)===year));
 const body=$('riderDeliveryBody');if(!body)return;
 body.innerHTML=rows.length?rows.map(o=>`<tr><td class="rider-record-date">${formatRiderDeliveryDate(o.date)}</td><td class="rider-record-date">${esc(o.time||'—')}</td><td>${esc(o.riderName)}</td><td>${esc(o.orderNumber)}</td><td>${esc(o.customerName)}</td><td>${money(o.total)}</td><td>${money(o.deliveryAmount)}</td><td><span class="order-status">${esc(o.status)}</span></td></tr>`).join(''):'<tr><td colspan="8">No delivery records match these filters.</td></tr>';
 const count=$('riderDeliveryCount');if(count)count.textContent=`Showing ${rows.length} of ${riderDeliveryRows.length} records`;
}
function clearRiderDeliveryFilters(){if($('riderDeliveryDate'))$('riderDeliveryDate').value='';if($('riderDeliveryYear'))$('riderDeliveryYear').value='';filterRiderDeliveryHistory()}

function openRiderEditor(r){r=r||{id:'',name:'',contact:'',username:'',status:'AVAILABLE'};content.insertAdjacentHTML('beforeend',`<div class="modal" id="riderModal"><div class="modalbox"><h2>${r.id?'Edit Rider':'Add Rider'}</h2><input id="r_id" type="hidden" value="${esc(r.id)}"><label>Rider name<input id="r_name" class="input" style="width:100%" value="${esc(r.name)}" autocomplete="name"></label><label>Contact number<input id="r_contact" class="input" style="width:100%" value="${esc(r.contact)}" autocomplete="tel"></label><label>Login username<input id="r_username" class="input" style="width:100%" value="${esc(r.username||'')}" autocomplete="username"></label><label>${r.id?'New password (leave blank to keep current)':'Password'}<input id="r_password" class="input" style="width:100%" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><label>Status<select id="r_status" class="input" style="width:100%"><option value="AVAILABLE" ${String(r.status).toUpperCase()==='AVAILABLE'?'selected':''}>Available</option><option value="ASSIGNED" ${String(r.status).toUpperCase()==='ASSIGNED'?'selected':''}>Assigned</option><option value="NOT AVAILABLE" ${String(r.status).toUpperCase()==='NOT AVAILABLE'?'selected':''}>Not Available</option></select></label><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveRiderForm()">SAVE RIDER</button><button class="btn" onclick="closeRiderEditor()">CANCEL</button></div></div></div>`)}
function saveRiderForm(){const r={id:$('r_id').value,name:$('r_name').value.trim(),contact:$('r_contact').value.trim(),username:$('r_username').value.trim(),password:$('r_password').value,status:$('r_status').value};if(!r.name||!r.username)return alert('Enter the rider name and username.');if(!r.id&&!r.password)return alert('Set a password for this rider account.');google.script.run.withSuccessHandler(()=>{closeRiderEditor();riders()}).withFailureHandler(e=>alert(e.message||e)).saveRider(r,user)}

function databaseHealth(){content.innerHTML='<h2>Database Health</h2><div class="card">Checking database health…</div>';google.script.run.withSuccessHandler(r=>{const rows=Object.entries(r.records||{});content.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2>Database Health</h2><div class="row"><button class="btn danger" onclick="resetAllDatabaseData()">RESET ALL DATA</button><button class="btn primary" onclick="databaseHealth()">↻ REFRESH</button></div></div><div class="cards"><div class="stat">Database Connection<br><b>${r.connected?'CONNECTED':'DISCONNECTED'}</b></div><div class="stat">Integrity Check<br><b style="color:${r.healthy?'#176b3a':'#b42318'}">${r.healthy?'HEALTHY':'CHECK NEEDED'}</b><div class="hint">${esc(r.integrity)}</div></div><div class="stat">Database File Size<br><b>${formatDatabaseBytes(r.sizeBytes)}</b></div></div><div class="card" style="margin-top:12px"><h3>Database Records</h3><table><thead><tr><th>Record Type</th><th>Count</th></tr></thead><tbody>${rows.map(([label,count])=>`<tr><td>${esc(label)}</td><td>${Number(count).toLocaleString('en-PH')}</td></tr>`).join('')}</tbody></table><p class="hint">Last checked: ${esc(r.checkedAt)}</p></div><div class="card" style="margin-top:12px"><h3>Database Backup &amp; Restore</h3><p class="hint">Export a consistent SQLite backup. Restoring replaces the current database and saves a safety copy first.</p><div class="row" style="align-items:end"><button class="btn primary" onclick="downloadDatabaseBackup()">⬇ EXPORT BACKUP</button><label class="order-filter-label">Choose backup file<input id="databaseBackupFile" class="input order-filter-field" type="file" accept=".sqlite,.sqlite3,.db,application/octet-stream"></label><button class="btn danger" onclick="restoreDatabaseBackup()">RESTORE DATABASE</button></div><p class="hint">SQLite database backup only.</p>${sessionStorage.getItem('lastDatabaseSafetyBackup')?`<div class="row"><button class="btn" onclick="downloadLastDatabaseSafetyBackup()">⬇ DOWNLOAD SAFETY BACKUP</button><span class="hint">${esc(sessionStorage.getItem('lastDatabaseSafetyBackup'))}</span></div>`:''}</div>`}).withFailureHandler(e=>{content.innerHTML=`<h2>Database Health</h2><div class="card sold">Unable to check the database: ${esc(e.message||e)}</div><button class="btn" onclick="databaseHealth()">TRY AGAIN</button>`}).getDatabaseHealth()}
function resetAllDatabaseData(){if(prompt('This permanently clears every record in the database. A safety backup will be created first. Type RESET to continue.')!=='RESET')return;google.script.run.withSuccessHandler(r=>{sessionStorage.setItem('lastDatabaseSafetyBackup',r.safetyBackup);alert(`All database data was reset. Safety backup saved as ${r.safetyBackup}. Use the download button below to keep a copy.`);databaseHealth()}).withFailureHandler(e=>alert(e.message||e)).resetDatabase()}
function downloadDatabaseBytes(filename,data){try{const raw=atob(data),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.sqlite3'})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('The database backup was created but could not be downloaded.')}}
function downloadDatabaseBackup(){google.script.run.withSuccessHandler(r=>downloadDatabaseBytes(r.filename,r.data)).withFailureHandler(e=>alert(e.message||e)).exportDatabase()}
function downloadLastDatabaseSafetyBackup(){const name=sessionStorage.getItem('lastDatabaseSafetyBackup');if(!name)return;google.script.run.withSuccessHandler(r=>downloadDatabaseBytes(r.filename,r.data)).withFailureHandler(e=>alert(e.message||e)).downloadDatabaseSafetyBackup(name)}
function restoreDatabaseBackup(){const input=$('databaseBackupFile'),file=input&&input.files&&input.files[0];if(!file)return alert('Choose a SQLite backup file first.');if(!confirm('Restore this database backup? Current data will be replaced. A safety backup of the current database will be saved automatically.'))return;const reader=new FileReader();reader.onerror=()=>alert('Could not read the selected backup file.');reader.onload=()=>{const data=String(reader.result||'').split(',')[1]||'';google.script.run.withSuccessHandler(r=>{sessionStorage.setItem('lastDatabaseSafetyBackup',r.safetyBackup);alert(`Database restored. Safety backup saved as ${r.safetyBackup}.`);databaseHealth()}).withFailureHandler(e=>alert(e.message||e)).importDatabase({filename:file.name,data},user)};reader.readAsDataURL(file)}
function formatDatabaseBytes(size){if(size===null||size===undefined)return'Unavailable';size=Number(size);if(size<1024)return size+' B';if(size<1048576)return(size/1024).toFixed(1)+' KB';return(size/1048576).toFixed(1)+' MB'}
function enhanceSukiRegistrationPreview(){const preview=$('sukiCardPreview');if(!preview)return;if(!$('sukiRegistrationPreviewPanel')){const panel=document.createElement('section');panel.id='sukiRegistrationPreviewPanel';panel.className='card';panel.style.cssText='margin:12px 0;padding:14px';panel.innerHTML='<h3 style="margin-top:0">Suki Card Preview</h3><p class="hint">Live preview while you enter the registration details.</p>';preview.parentNode.insertBefore(panel,preview);panel.appendChild(preview)}if(!preview.querySelector('.suki-id-card'))preview.innerHTML=sukiCardMarkup({name:$('sukiName')?.value.trim()||'CARD HOLDER NAME',cardNumber:'CARD NUMBER',expiresOn:$('sukiExpiry')?.value||''});const name=$('sukiName'),expiry=$('sukiExpiry');if(name&&!name.dataset.previewBound){name.dataset.previewBound='1';name.addEventListener('input',updateSukiRegistrationPreview)}if(expiry&&!expiry.dataset.previewBound){expiry.dataset.previewBound='1';expiry.addEventListener('input',updateSukiRegistrationPreview);expiry.addEventListener('change',updateSukiRegistrationPreview)}}function updateSukiRegistrationPreview(){const preview=$('sukiCardPreview');if(!preview)return;preview.innerHTML=sukiCardMarkup({name:$('sukiName')?.value.trim()||'CARD HOLDER NAME',cardNumber:'CARD NUMBER',expiresOn:$('sukiExpiry')?.value||''})}new MutationObserver(enhanceSukiRegistrationPreview).observe($('app'),{childList:true,subtree:true});function logout(){endAdminSession()}restoreAdminSession();</script></body></html>
