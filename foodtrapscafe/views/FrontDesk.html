<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodtraps Front Desk</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#222;font-size:14px}header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}main{padding:18px;max-width:1300px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:#fff;border-radius:13px;padding:16px;box-shadow:0 2px 10px #0001}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:12px}.ok{background:#176b3a;color:white}.warn{background:#c98a00;color:white}.danger{background:#b42318;color:white}.dark{background:#222;color:white}.muted{color:#666}.login{max-width:380px;margin:80px auto}.input,select{padding:10px;margin:5px 0 10px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;font:inherit}.field{width:100%}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;font-size:11px;font-weight:bold}.item{padding:8px 0;border-bottom:1px solid #eee}.tablewrap{max-height:65vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001}.tablewrap th{position:sticky;top:0;z-index:2;background:#f7f7f7}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #eee}th{background:#f7f7f7;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.orderTypeCard{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0;min-height:92px;padding:12px 14px;text-align:left;background:#e5e5e5;color:#222;border:2px solid transparent}.orderTypeCard .typeName{font-size:13px}.orderTypeCard .typeCount{font-size:11px;font-weight:400;opacity:.82}.orderTypeCard .typeAmountLabel{font-size:10px;font-weight:400;opacity:.82;margin-top:2px}.orderTypeCard .typeAmount{font-size:16px;line-height:1.2;overflow-wrap:anywhere}.orderTypeCard .typePaymentSplit{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;border-top:1px solid rgba(91,53,31,.2);padding-top:8px;margin-top:3px}.orderTypeCard.active .typePaymentSplit{border-top-color:rgba(255,255,255,.38)}.orderTypeCard .typePaymentCell{display:flex;flex-direction:column;gap:3px;min-width:0}.orderTypeCard .typePaymentCell+ .typePaymentCell{border-left:1px solid rgba(91,53,31,.2);padding-left:9px}.orderTypeCard.active .typePaymentCell+.typePaymentCell{border-left-color:rgba(255,255,255,.38)}.orderTypeCard .typePaymentLabel{font-size:10px;font-weight:400;opacity:.82}.orderTypeCard .typePaymentValue{font-size:13px;line-height:1.2;overflow-wrap:anywhere}.orderTypeCard.active{background:#176b3a;color:white;border-color:#12552e}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.tabs{grid-template-columns:1fr}}.section{margin:16px 0}.qty{width:68px;padding:6px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.box{background:#fff;padding:18px;border-radius:13px;width:min(650px,100%);max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menuSearch{width:100%;box-sizing:border-box;padding:11px 12px;margin:8px 0;border:1px solid #bbb;border-radius:8px;font:inherit}.searchResults{max-height:190px;overflow-y:auto;border:1px solid #eee;border-radius:8px;margin-bottom:12px}.searchHit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #eee}.searchHit:last-child{border-bottom:0}.selectedTotal{display:flex;justify-content:space-between;align-items:center;background:#f1f7f2;border:1px solid #d9eadc;border-radius:9px;padding:12px;margin-top:12px;font-weight:700}.lineSubtotal{font-size:12px;color:#333;font-weight:700;min-width:76px;text-align:right}.order-time{font-size:11px;color:#666;white-space:nowrap}.order-items-cell{font-size:11px;line-height:1.35}.customer-special-instructions{display:inline-block;margin-top:4px;font-size:10px;color:#7a4b2a;white-space:normal;overflow-wrap:anywhere}.dailyStats{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:10px;margin:12px 0}.dailyStat{background:#fff;border-radius:11px;padding:13px 16px;box-shadow:0 2px 10px #0001}.dailyStat span{display:block;color:#666;font-size:11px}.dailyStat strong{display:block;font-size:20px;margin-top:4px}@media(max-width:600px){.dailyStats{grid-template-columns:1fr}}@media(max-width:600px){.two{grid-template-columns:1fr}}
.frontdesk-order-actions .btn{font-size:8px;padding:4px 3px;line-height:1.05}/* Elegant coffee-and-cream theme, matched to Admin */:root{--brown:#5b351f;--brown2:#7a4b2a;--cream:#f8f2e8;--paper:#fffdf8;--line:#eadfce;--text:#2e241e;--muted:#85776c;--shadow:0 8px 25px rgba(72,44,26,.08)}*{box-sizing:border-box}body{font-family:'DM Sans',Arial,sans-serif;background:radial-gradient(ellipse at 12% 0%,rgba(214,185,145,.22),transparent 36%),linear-gradient(135deg,#f8f2e8,#f2e8d9);background-attachment:fixed;color:var(--text)}header{position:relative;overflow:hidden;background:linear-gradient(110deg,#321b0f 0%,#5b351f 54%,#7a4b2a 100%);box-shadow:0 8px 24px rgba(50,27,15,.22)}header:after{content:"✦";position:absolute;right:26%;top:4px;color:rgba(255,245,220,.76);font-size:18px;text-shadow:0 0 12px #f8e2b2;animation:fdSparkle 3.2s ease-in-out infinite;pointer-events:none}.card,.tablewrap,.box{background:var(--paper);border:1px solid var(--line);box-shadow:0 5px 18px rgba(72,44,26,.07),0 1px 2px rgba(72,44,26,.05);border-radius:15px}.tablewrap{overflow:auto}.tablewrap table{background:transparent}th,td{border-bottom-color:var(--line)}th{background:linear-gradient(180deg,#fffdf8,#f8f2e8);color:var(--brown)}.btn{background:#f1e4d4;color:var(--brown);transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(91,53,31,.14)}.ok,.orderTypeCard.active{background:var(--brown);color:white;border-color:var(--brown)}.ok:hover,.orderTypeCard.active:hover{background:var(--brown2)}.warn{background:#d6b991;color:var(--text)}.danger{background:#b42318;color:#fff}.dark{background:#321b0f;color:#fff}.orderTypeCard{background:rgba(255,253,248,.86);border-color:var(--line);border-radius:13px;box-shadow:0 3px 12px rgba(72,44,26,.05)}.orderTypeCard:not(.active):hover{background:#f1e4d4}.input,select,.menuSearch{border-color:var(--line);background:#fffdf8;color:var(--text)}.pill{background:var(--cream);color:var(--brown);border:1px solid var(--line)}.muted{color:var(--muted)}@keyframes fdSparkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.16) rotate(22deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}.orderTypeCard .typeName{display:flex;align-items:center;gap:7px}.order-bill{display:inline-flex;align-items:center;justify-content:center;font-size:15px;filter:drop-shadow(0 1px 2px rgba(50,27,15,.2));transform-origin:50% 80%;animation:billNudge 1.5s ease-in-out infinite}.orderTypeCard:not(.active) .order-bill{filter:sepia(.25) drop-shadow(0 1px 2px rgba(50,27,15,.2))}@keyframes billNudge{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-8deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-2px) rotate(8deg)}}main:has(.formal-login){min-height:calc(100vh - 68px);display:grid;place-items:center;padding:28px}.formal-login{width:min(440px,100%);max-width:440px;margin:0;padding:30px;border-radius:18px}.login-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#f1e4d4,#fff8ed);border:1px solid var(--line);color:#a77b45;font-size:21px;box-shadow:0 3px 10px rgba(72,44,26,.08)}.login-eyebrow{margin:18px 0 5px;color:var(--brown2);font-size:10px;font-weight:800;letter-spacing:1.5px}.formal-login h2{margin:0;color:var(--brown);font-size:23px}.login-subtitle{margin:7px 0 22px;color:var(--muted);font-size:13px;line-height:1.5}.formal-login label{display:block;margin:13px 0 5px;color:#4a2b1b;font-size:12px;font-weight:700}.formal-login .input{margin:0}.login-submit{width:100%;margin:20px 0 0;padding:12px}.login-footnote{margin:14px 0 0;text-align:center;color:var(--muted);font-size:11px}@media(max-width:600px){main:has(.formal-login){padding:16px}.formal-login{padding:22px}}.payment-state{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.paid-state{background:#e8f3e9;color:#176b3a}.unpaid-state{background:#f8f2e8;color:#7a4b2a}.partial-state{background:#fff1d6;color:#805800}.btn{font-size:10px}.cancel-reason{margin-top:5px;color:#a1261c;font-size:11px;line-height:1.4;max-width:250px}.packaging-control{font-size:12px}.packaging-control select{font-size:12px;padding:8px}.packaging-qty{font-size:11px}.packaging-qty button{font-size:9px;padding:6px 9px}.packaging-total{font-size:10px}.tablewrap td:last-child{min-width:540px}.tablewrap td:last-child .row{display:flex;gap:0;align-items:center;flex-wrap:nowrap;width:100%;justify-content:flex-start}.tablewrap td:last-child .row .btn{box-sizing:border-box;width:auto;flex:1 1 auto;min-width:0;padding:5px 4px;font-size:9px;line-height:1.15;white-space:nowrap;text-align:center;margin:0}.frontdesk-bill-breakdown{margin:12px 0;padding:12px 14px;background:#fffdf8;border:1px solid var(--line);border-radius:10px}.frontdesk-bill-breakdown h3{margin:0 0 8px;color:var(--brown)}.frontdesk-bill-breakdown .bill-line{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line)}.frontdesk-bill-breakdown .bill-total{margin-top:4px;padding-top:9px;border-bottom:0;border-top:2px solid var(--brown);font-size:16px}.order-cost-breakdown{display:grid;gap:2px;margin-top:5px;color:var(--muted);font-size:9px;line-height:1.3}</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px"><img src="assets/foodtraps-logo.png" alt="" style="width:72px;height:42px;object-fit:contain;background:#fff8ed;border-radius:7px;padding:3px"><div><b>FOODTRAPS CAFÉ</b><div>FRONT DESK / CASHIER</div></div></div><div style="display:flex;gap:8px;align-items:center"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right"><div id="frontDeskHeaderLoggedIn" style="font-size:15px;line-height:1.25;font-weight:700"></div><button class="btn danger" onclick="logout()">⏻ Log Out</button></div></div></header>
<main id="app"></main>
<script>
let user='',frontDeskName='',allOrders=[],menuItems=[],activeType='Dine-In',createCart={},createPackagingQty=0,editCart={},editingOrder='',refreshTimer=null,sukiCardLookup=null,frontDeskDeliveryFee=0;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₱'+Number(n||0).toFixed(2)}
function manilaTodayKey(){const p=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function orderDateKey(value){const s=String(value||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=value instanceof Date?value:new Date(s);if(Number.isNaN(d.getTime()))return '';const p=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function pointsPromoActive(m){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return !!m.pointsEnabled&&Number(m.pointsPerItem)>0&&!!m.pointsExpiresOn&&m.pointsExpiresOn>=d.toISOString().slice(0,10)}
function todayOrders(){const key=manilaTodayKey();return allOrders.filter(o=>orderDateKey(o.date)===key&&String(o.status||'').toUpperCase()!=='CANCELLED')}
function shortDate(value){const s=String(value||'').trim(),ymd=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);const d=ymd?new Date(Number(ymd[1]),Number(ymd[2])-1,Number(ymd[3])):new Date(s);return Number.isNaN(d.getTime())?s:d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})}
function shortTime(value){const s=String(value||'').trim(),m=s.match(/(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*(AM|PM)?/i);if(!m)return s;let h=Number(m[1]);const suffix=m[3]?m[3].toUpperCase():(h>=12?'PM':'AM');if(m[3])h=h%12+(suffix==='PM'?12:0);const h12=h%12||12;return `${h12}:${m[2]} ${suffix}`}
function login(){ $('app').innerHTML='<div class="login card formal-login"><img src="assets/foodtraps-logo.png" alt="Foodtraps Café" style="display:block;width:150px;height:84px;object-fit:contain;margin:0 auto 12px"><div class="login-mark" aria-hidden="true">✦</div><p class="login-eyebrow">FOODTRAPS CAFÉ</p><h2>Front Desk Sign In</h2><p class="login-subtitle">Enter your staff credentials to manage customer orders.</p><label for="u">Username</label><input id="u" class="input field" autocomplete="username" placeholder="Enter username" value="frontdesk"><label for="p">Password or PIN</label><input id="p" class="input field" type="password" autocomplete="current-password" placeholder="Enter password or PIN" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn ok login-submit" onclick="doLogin()">SIGN IN</button><button id="localTestLoginButton" class="btn login-submit" style="margin-top:6px;background:#eee;color:#333" onclick="quickLocalTestLogin()">LOCAL TEST ACCESS</button><p class="login-footnote">Authorized front desk staff only</p></div>';if(!['localhost','127.0.0.1','::1'].includes(location.hostname.toLowerCase()))$('localTestLoginButton')?.remove(); }
function quickLocalTestLogin(){google.script.run.withSuccessHandler(r=>{user=r.username;frontDeskName=r.fullName||r.username;const headerWho=$('frontDeskHeaderLoggedIn');if(headerWho)headerWho.textContent='Logged in as '+frontDeskName;startRealtimeRefresh();load()}).withFailureHandler(err).startLocalTestSession('FRONTDESK')}
function doLogin(){google.script.run.withSuccessHandler(r=>{if(!r.ok)return alert(r.message);user=r.username;frontDeskName=r.fullName||r.username;const headerWho=$('frontDeskHeaderLoggedIn');if(headerWho)headerWho.textContent='Logged in as '+frontDeskName;startRealtimeRefresh();load()}).withFailureHandler(err).loginStaff($('u').value,$('p').value,'FRONTDESK')}
function restoreFrontDeskSession(){google.script.run.withSuccessHandler(r=>{if(r&&r.role==='FRONTDESK'){user=r.username;frontDeskName=r.fullName||r.username;const headerWho=$('frontDeskHeaderLoggedIn');if(headerWho)headerWho.textContent='Logged in as '+frontDeskName;startRealtimeRefresh();load()}else login()}).withFailureHandler(login).getStaffSession()}
function logout(){if(!user){login();return}if(!confirm('Log out of the Front Desk?'))return;if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}user='';frontDeskName='';const headerWho=$('frontDeskHeaderLoggedIn');if(headerWho)headerWho.textContent='';google.script.run.withSuccessHandler(login).withFailureHandler(e=>{alert(e&&e.message||e);login()}).logoutStaff()}
function err(e){alert(e&&e.message||e)}
function frontDeskModalOpen(){return !!($('createModal')||$('editModal')||$('packagingModal')||$('cancelOrderModal')||$('paymentModal')||$('closingSummaryModal')||$('pettyCashModal'))}function load(){if(!user)return login();google.script.run.withSuccessHandler(rows=>{if(frontDeskModalOpen())return;allOrders=rows||[];render()}).withFailureHandler(err).getFrontDeskOrders()}
function refreshDashboard(){if(!user)return login();if(frontDeskModalOpen())return;const b=$('refreshBtn');if(b){b.disabled=true;b.textContent='↻ Refreshing…'}google.script.run.withSuccessHandler(rows=>{if(frontDeskModalOpen()){if(b){b.disabled=false;b.textContent='↻ Refresh'}return}allOrders=rows||[];render();if(b){b.disabled=false;b.textContent='↻ Refresh'}}).withFailureHandler(e=>{if(b){b.disabled=false;b.textContent='↻ Refresh'}err(e)}).getFrontDeskOrders()}
function startRealtimeRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!user||document.hidden||frontDeskModalOpen())return;google.script.run.withSuccessHandler(rows=>{if(!user||frontDeskModalOpen())return;allOrders=rows||[];render()}).withFailureHandler(e=>{clearInterval(refreshTimer);refreshTimer=null;err(e)}).getFrontDeskOrders()},10000)}
function loadMenu(cb){let pending=2;const done=()=>{if(--pending===0&&cb)cb()};google.script.run.withSuccessHandler(a=>{menuItems=(a||[]).filter(x=>x.available);done()}).withFailureHandler(e=>{err(e);done()}).getMenu();google.script.run.withSuccessHandler(settings=>{frontDeskDeliveryFee=Number(settings?.deliveryFee||0);done()}).withFailureHandler(e=>{frontDeskDeliveryFee=0;err(e);done()}).getSystemSettings()}
function openClosingSummary(){const old=$('closingSummaryModal');if(old)old.remove();$('app').insertAdjacentHTML('beforeend',`<div class="modal" id="closingSummaryModal"><div class="box" style="max-width:420px"><h2>Daily Cashier Closing</h2><p class="muted">Print today’s sales and payment totals first. After printing, you can record any petty cash left for the next drawer.</p><div class="row"><button class="btn ok" onclick="printDailyClosing()">CONTINUE TO PRINT</button><button class="btn" onclick="closeModal('closingSummaryModal')">CANCEL</button></div></div></div>`)}
function printDailyClosing(){const closingModal=$('closingSummaryModal');if(closingModal)closingModal.remove();google.script.run.withSuccessHandler(orders=>{orders=orders||[];const day=manilaTodayKey(),paymentTotals={};let totalSales=0,collected=0,cashCollected=0,changeReturned=0,unpaid=0,discounts=0,vatCollected=0;for(const o of orders){const total=Number(o.total||0),received=Math.max(0,Number(o.amountReceived||0)),paidAmount=Math.min(total,received),change=Math.min(paidAmount,Math.max(0,Number(o.change||0))),method=String(o.paymentMethod||'Other');const net=method.toUpperCase()==='CASH'?Math.max(0,received-change):paidAmount;totalSales+=total;collected+=net;unpaid+=Math.max(0,total-paidAmount);changeReturned+=Math.min(change,received);discounts+=Number(o.discount||0)+Number(o.sukiDiscount||0);if((received>0&&received+0.001>=total)||String(o.status||'').toUpperCase()==='PAID')vatCollected+=Number(o.vatAmount||0);paymentTotals[method]=(paymentTotals[method]||0)+net;if(method.toUpperCase()==='CASH')cashCollected+=net}const line=(label,value,bold=false)=>`<div class="line ${bold?'bold':''}"><span>${label}</span><b>${value}</b></div>`,payments=Object.entries(paymentTotals).map(([method,amount])=>line(method,money(amount))).join('')||line('No payments collected',money(0));const popup=window.open('','_blank','width=460,height=700');if(!popup)return alert('Allow pop-ups for this site to print the closing summary.');popup.document.open();popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Cashier Closing · ${day}</title><style>*{box-sizing:border-box}body{font:13px Arial,sans-serif;color:#24180f;margin:0;padding:18px}.report{max-width:390px;margin:auto}.brand{text-align:center;border-bottom:1px dashed #9a8877;padding-bottom:10px}.brand img{width:125px;height:64px;object-fit:contain}.brand h1{font-size:18px;margin:3px}.brand p{margin:4px;font-size:11px}.meta{padding:9px 0;border-bottom:1px dashed #9a8877;line-height:1.7}.title{font-weight:bold;margin:12px 0 5px}.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted #ddd}.line b{text-align:right;white-space:nowrap}.bold{font-size:15px;border-top:1px solid #24180f;border-bottom:0;margin-top:5px;padding-top:9px}.note{margin-top:12px;font-size:10px;color:#65584c;text-align:center}.actions{text-align:center;margin:18px}.actions button{padding:9px 10px;margin:3px;border:0;border-radius:6px;background:#5b351f;color:#fff;font-weight:bold}@media print{body{padding:0}.report{width:72mm;max-width:none}.actions{display:none}@page{size:80mm auto;margin:4mm}}</style></head><body><article class="report"><header class="brand"><img src="${new URL('assets/foodtraps-logo.png',document.baseURI).href}" alt="Foodtraps Café"><h1>FOODTRAPS CAFÉ</h1><p>DAILY CASHIER CLOSING SUMMARY</p></header><div class="meta"><div>Date: <b>${day}</b></div><div>Cashier: <b>${esc(frontDeskName||user||'Front Desk')}</b></div><div>Orders counted: <b>${orders.length}</b></div></div><div class="title">DAILY TOTALS</div>${line('Total order amount',money(totalSales))}${line('Total collected',money(collected))}${line('Cash collected from orders',money(cashCollected))}${line('Cash sales total',money(cashCollected),true)}${line('Change returned',money(changeReturned))}${line('Unpaid balance',money(unpaid))}${line('Discounts',money(discounts))}${line('VAT collected · paid orders',money(vatCollected))}<div class="title">PAYMENT BREAKDOWN</div>${payments}<p class="note">Cancelled orders are excluded. Keep this report for end-of-day reconciliation.</p><div class="actions"><button onclick="window.print()">PRINT SUMMARY</button> <button onclick="if(window.opener)window.opener.recordPettyCashAfterClosing();window.close()">DONE · RECORD PETTY CASH</button></div></article><script>window.onload=()=>setTimeout(()=>window.print(),200);<\/script></body></html>`);popup.document.close()}).withFailureHandler(err).getMyCashierClosingOrders()}
function recordPettyCashAfterClosing(){const old=$('closingSummaryModal');if(old)old.remove();$('app').insertAdjacentHTML('beforeend',`<div class="modal" id="pettyCashModal"><div class="box" style="max-width:420px"><h2>Record Petty Cash</h2><p class="muted">Today’s sales totals stay in the records. Enter the cash you are leaving in the drawer for the next shift. This is recorded separately and is not counted as sales.</p><label>Petty cash left in drawer<input id="pettyCashAmount" class="input field" type="number" min="0" step="0.01" value="0.00" inputmode="decimal"></label><label>Note (optional)<input id="pettyCashNote" class="input field" maxlength="300" placeholder="For next shift"></label><div class="row"><button class="btn ok" onclick="savePettyCash()">SAVE PETTY CASH</button><button class="btn" onclick="closeModal('pettyCashModal')">CANCEL</button></div></div></div>`);$('pettyCashAmount')?.focus()}

function printMyCashierRecords(){if(!user)return alert('Please sign in to print your cashier records.');google.script.run.withSuccessHandler(rows=>{const records=rows||[];if(!records.length)return alert('There are no transactions under your name to print.');const popup=window.open('','_blank','width=800,height=700');if(!popup)return alert('Allow pop-ups for this site to print your records.');const rowsHtml=records.map(r=>`<tr><td>${esc(r.date)} ${esc(r.time)}</td><td>${esc(r.recordType)}</td><td>${esc(r.reference)}</td><td>${esc(r.customer)}</td><td>${esc(r.details)}</td><td class="money">${money(r.amount)}</td><td class="money">${money(r.collected)}</td></tr>`).join('');popup.document.open();popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Cashier Records · ${esc(frontDeskName||user)}</title><style>body{font:12px Arial,sans-serif;color:#24180f;margin:22px}h1{font-size:19px;margin:0 0 5px}.meta{color:#66594e;margin-bottom:16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d8cbbb;padding:7px;text-align:left;vertical-align:top}th{background:#f5ecdf}.money{text-align:right;white-space:nowrap}.actions{margin:16px 0}button{padding:9px 14px;background:#5b351f;color:white;border:0;border-radius:5px;font-weight:bold}@media print{body{margin:0}.actions{display:none}}</style></head><body><h1>Cashier Transaction Records</h1><div class="meta">Cashier: <b>${esc(frontDeskName||user)}</b> · Printed: ${esc(new Date().toLocaleString('en-PH',{timeZone:'Asia/Manila'}))} · ${records.length} record(s)</div><table><thead><tr><th>Date / time</th><th>Record</th><th>Reference</th><th>Customer</th><th>Details</th><th>Amount</th><th>Collected</th></tr></thead><tbody>${rowsHtml}</tbody></table><div class="actions"><button onclick="window.print()">PRINT</button></div><script>window.onload=()=>setTimeout(()=>window.print(),200);<\/script></body></html>`);popup.document.close()}).withFailureHandler(err).getMyCashierRecords()}
function loadMyCashierRecords(){const target=$('myCashierRecords');if(!target||!user)return;google.script.run.withSuccessHandler(rows=>{const box=$('myCashierRecords');if(!box)return;const records=rows||[];box.innerHTML=records.length?`<table style="min-width:760px"><thead><tr><th>Date / time</th><th>Record</th><th>Reference</th><th>Customer</th><th>Details</th><th>Amount</th><th>Collected</th></tr></thead><tbody>${records.map(r=>`<tr><td>${esc(r.date)}<br><small>${esc(r.time)}</small></td><td>${esc(r.recordType)}</td><td><b>${esc(r.reference)}</b></td><td>${esc(r.customer)}</td><td>${esc(r.details)}</td><td>${money(r.amount)}</td><td>${money(r.collected)}</td></tr>`).join('')}</tbody></table>`:`<div class="card muted">No transactions recorded under ${esc(frontDeskName||user)} yet.</div>`}).withFailureHandler(e=>{const box=$('myCashierRecords');if(box)box.innerHTML=`<div class="card">Unable to load your records: ${esc(e.message||e)}</div>`}).getMyCashierRecords()}
function orderCard(o){
 const status=String(o.status||'').toUpperCase(),delivery=o.orderType==='Delivery';
 const amountReceived=Number(o.amountReceived||0),paid=(amountReceived>=Number(o.total||0)&&amountReceived>0)||status==='PAID';
 const closed=['PAID','CANCELLED','COMPLETED'].includes(status),delivered=status==='DELIVERED';
 const canComplete=paid&&(!delivery||delivered);
 const paidAction=paid?'<button class="btn ok paid-action" disabled title="Payment received">✓ PAYMENT COLLECTED</button>':`<button class="btn ok paid-action" onclick="openPayment('${esc(o.orderNumber)}')">COLLECT PAYMENT</button>`;
 const complete=canComplete?`<button class="btn ok complete-action" onclick="completeOrder('${esc(o.orderNumber)}','${delivery?'DELIVERED':'SERVED'}')">✓ COMPLETE</button>`:`<button class="btn ok complete-action" disabled title="${delivery?'Available after delivery is marked delivered':'Collect the full payment before completing'}">✓ COMPLETE</button>`;
 const receiptAction=`<button class="btn" onclick="printReceipt('${esc(o.orderNumber)}')">PRINT RECEIPT</button>`;
 const actions=closed?'':delivered?`${paidAction}${complete}`:paid?`<button class="btn ok" onclick="send('${esc(o.orderNumber)}')">SEND TO KITCHEN</button>${complete}`:`<button class="btn dark" onclick="openEdit('${esc(o.orderNumber)}')">EDIT ITEMS</button><button class="btn warn" style="background:#f2c230;color:#3b2a00" onclick="hold('${esc(o.orderNumber)}')">HOLD</button>${paidAction}<button class="btn ok" onclick="send('${esc(o.orderNumber)}')">SEND TO KITCHEN</button>${complete}<button class="btn danger" onclick="cancelOrder('${esc(o.orderNumber)}')">CANCEL ORDER</button>`;
 const newOrderAction=paid?`<button class="btn ok" onclick="addAnotherOrder('${esc(o.orderNumber)}')">ADD ANOTHER ORDER</button>`:'';
 const paymentState=paid?'<span class="payment-state paid-state">✓ PAYMENT COLLECTED</span>':amountReceived>0?`<span class="payment-state partial-state">PARTIAL · ${money(amountReceived)}</span>`:'<span class="payment-state unpaid-state">NOT PAID YET</span>';
 const cancellationReason=o.cancellationReason?`<div class="cancel-reason"><b>Cancellation reason:</b> ${esc(o.cancellationReason)}</div>`:'';
 return `<tr><td><b>${esc(o.orderNumber)}</b><br><span class="order-time" title="${esc(o.date)} ${esc(o.time)}">${esc(shortDate(o.date))}, ${esc(shortTime(o.time))}</span></td><td><b>${esc(o.customerName)}</b><br>${esc(o.contactNumber)}${o.sukiCardNumber?`<br><small class="muted">Suki · ${esc(o.sukiCardNumber)}${o.sukiPointsRedeemed?` · −${Number(o.sukiPointsRedeemed)} points`:""}${o.sukiPointsEarned?` · +${Number(o.sukiPointsEarned)} point${Number(o.sukiPointsEarned)===1?'':'s'}`:""}</small>`:""}</td><td class="order-items-cell">${(o.items||[]).map(i=>`${esc(i.itemName)} × ${i.quantity} (${money(i.subtotal)})`).join('<br>')}${o.packagingNote?`<br><small class="muted">Customer packaging note: ${esc(o.packagingNote)}</small>`:''}${o.packagingType?`<br><small class="muted">Packaging · ${esc(o.packagingType)} × ${Number(o.packagingQuantity||1)} (${money(o.packagingFee)})</small>`:''}${o.specialInstructions?`<br><small class="customer-special-instructions"><b>Special instructions:</b> ${esc(o.specialInstructions)}</small>`:''}</td><td>${esc(o.deliveryAddress||'—')}</td><td>${esc(o.paymentMethod)}<br>${paymentState}${o.paymentReference?`<br><small class="muted">Ref: ${esc(o.paymentReference)}</small>`:''}${o.privilegeIdNumber?`<br><small class="muted">${esc(o.privilegeIdType)} ID: ${esc(o.privilegeIdNumber)}</small>`:''}</td><td><b>${money(o.total)}</b><div class="order-cost-breakdown"><span>Food: ${money(o.subtotal)}</span><span>Discount: −${money(o.discount)}</span><span>Suki: −${money(o.sukiDiscount||0)} · ${Number(o.sukiPointsRedeemed||0)} pts</span><span>VAT 12%: ${money(o.vatAmount||0)}</span><span>Delivery: ${money(o.deliveryFee)}</span><span>Packaging: ${money(o.packagingFee||0)}</span></div></td><td><span class="pill">${esc(o.status)}${paid?' · LOCKED':''}</span>${cancellationReason}<div class="row frontdesk-order-actions" style="margin-top:8px">${actions}${newOrderAction}${receiptAction}</div></td></tr>`
}
function code39Svg(value){const patterns={'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100','A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000','F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100','K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010','P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110','U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000','Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','$':'010101000','/':'010100010','+':'010001010','%':'000101010','*':'010010100'};const chars='*'+String(value||'').toUpperCase().replace(/[^0-9A-Z. $/+%-]/g,'')+'*';let x=8;const bars=[];for(const ch of chars){const p=patterns[ch]||patterns['-'];for(let i=0;i<p.length;i++){const width=p[i]==='1'?3:1;if(i%2===0)bars.push(`<rect x="${x}" y="0" width="${width}" height="48"/>`);x+=width}x+=1}return `<svg class="order-barcode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+7} 48" role="img" aria-label="Barcode for order ${esc(value)}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><g fill="#111">${bars.join('')}</g></svg>`}

 box.innerHTML=(rows||'<p class="muted">No items added.</p>')+`<section class="frontdesk-bill-breakdown"><h3>Bill Breakdown</h3><div class="bill-line"><span>Food subtotal · ${count} item${count===1?'':'s'}</span><b>${money(itemsTotal)}</b></div><div class="bill-line"><span>${discountType==='None'?'Other discount':esc(discountType)+' discount'}</span><span>−${money(discount)}</span></div><div class="bill-line"><span>Suki redemption · ${requestedRedeemPoints} points</span><span>−${money(sukiDiscount)}</span></div><div class="bill-line"><span>VAT ${vatExempt?'exempt':'12% · per item'}</span><span>${money(vatAmount)}</span></div><div class="bill-line"><span>Delivery fee</span><span>${money(deliveryFee)}</span></div><div class="bill-line"><span>Packaging${packageName?' · '+esc(packageName)+' × '+createPackagingQty:''}</span><span>${money(packageFee)}</span></div><div class="bill-line bill-total"><b>Total due</b><b>${money(total)}</b></div></section>${requestedRedeemPoints>maxRedeemablePoints?`<div class="hint" style="color:#b42318">Eligible menu items in this order allow up to ${maxRedeemablePoints} points after other discounts.</div>`:''}${sukiCardLookup&&requestedRedeemPoints>sukiCardLookup.pointsAvailable?`<div class="hint" style="color:#b42318">Only ${sukiCardLookup.pointsAvailable} points are available on this card.</div>`:''}`+($('c_sukiCardNumber')?.value.trim()?`<div class="selectedTotal"><span>Suki Card reward</span><span>${eligiblePoints<=0?'No eligible items':itemsTotal-discount-sukiDiscount>=1000?'+'+eligiblePoints+' points':'Need '+money(Math.max(0,1000-(itemsTotal-discount-sukiDiscount)))+' more menu spend'}</span></div>`:'');

function openEdit(id){const o=allOrders.find(x=>x.orderNumber===id);if(!o)return;editingOrder=id;editCart={};(o.items||[]).forEach(i=>editCart[i.itemId]=i.quantity);loadMenu(()=>{$('app').insertAdjacentHTML('beforeend',`<div class="modal" id="editModal"><div class="box"><h2>Edit ${esc(id)} items</h2><p>Change quantities, remove items, adjust packaging, or add another menu item. Prices are refreshed from the menu.</p>${['Take-Out','Pick-Up','Delivery'].includes(o.orderType)?`<label>Customer packaging preference<select id="e_packagingNote" class="input field"><option value="" ${!o.packagingNote?'selected':''}>Not specified</option><option value="Needs packaging" ${o.packagingNote==='Needs packaging'?'selected':''}>Needs packaging</option><option value="No packaging needed" ${o.packagingNote==='No packaging needed'?'selected':''}>No packaging needed</option></select></label><div class="row" style="margin:8px 0 14px"><button class="btn packaging-action" onclick="openPackaging('${esc(o.orderNumber)}','${esc(o.packagingType||'')}',${Number(o.packagingQuantity||0)})">${o.packagingType?'EDIT PACKAGING':'ADD PACKAGING'}</button>${o.packagingType?`<span class="muted">${esc(o.packagingType)} × ${Number(o.packagingQuantity||1)} · ${money(o.packagingFee)}</span>`:''}</div>`:''}<label>Suki Card number (optional)<input id="e_sukiCardNumber" class="input field" value="${esc(o.sukiCardNumber||'')}" placeholder="Enter the member’s card number"></label><div class="hint">This order used ${Number(o.sukiPointsRedeemed||0)} Suki points for ${money(o.sukiDiscount||0)} off. The card and redemption amount stay linked while editing.</div><div class="hint">Selected menu items earn promo points when the discounted food subtotal is at least ₱1,000 and an active Suki Card is entered.</div><div id="editLines"></div><div class="row"><select id="e_item" class="input" style="flex:1"><option value="">Choose menu item to add</option>${menuItems.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} · ${mo function openPayment(id){const o=allOrders.find(x=>x.orderNumber===id);if(!o)return;const digital=['GCASH','MAYA','BANK TRANSFER','OTHER E-PAYMENT'].includes(String(o.paymentMethod||'').toUpperCase());const old=$('paymentModal');if(old)old.remove();$('app').insertAdjacentHTML('beforeend',`<div class="modal" id="paymentModal"><div class="box" style="max-width:480px"><h2>Collect Payment</h2><div class="selectedTotal" style="display:block;line-height:1.8"><div><b>Order code:</b> ${esc(o.orderNumber)}</div><div><b>Customer:</b> ${esc(o.customerName)}</div><div><b>Contact number:</b> ${esc(o.contactNumber)}</div><div><b>Payment method:</b> ${esc(o.paymentMethod)}${o.paymentReference?` · Ref: ${esc(o.paymentReference)}`:''}</div><div><b>Amount due:</b> ${money(o.total)}</div></div>${['Senior Citizen','PWD'].includes(o.discountType)?`<label style="display:block;margin-top:12px">Privilege card type<select id="paymentPrivilegeIdType" class="input field"><option value="Senior Citizen" ${o.discountType==='Senior Citizen'?'selected':''}>Senior Citizen</option><option value="PWD" ${o.discountType==='PWD'?'selected':''}>PWD</option></select></label><label style="display:block;margin-top:8px">Senior Citizen / PWD card number<input id="paymentPrivilegeIdNumber" class="input field" maxlength="80" autocomplete="off" value="${esc(o.privilegeIdNumber||'')}" placeholder="Enter card or ID number"></label>`:''}${digital?`<p class="muted" style="margin:12px 0 4px">Verify that the transaction succeeded, then enter the same reference number to confirm it.</p><label style="display:block">Confirm customer reference number<input id="paymentReferenceVerify" class="input field" autocomplete="off" placeholder="Enter the reference shown above" oninput="updatePaymentChange(${Number(o.total||0)})"></label><div id="referenceMatchStatus" class="muted" style="margin:0 0 10px">Reference must match the customer’s submitted number.</div>`:''}<label style="display:block;margin-top:14px">Amount received<inpu function updatePaymentChange(total){const input=$('paymentAmountReceived'),display=$('paymentChange'),button=$('paymentConfirm'),received=Number(input?.value||0),verify=$('paymentReferenceVerify'),expected=String(verify?.dataset.expectedReference||'').trim(),refMatches=!verify||(!!expected&&verify.value.trim().toLowerCase()===expected.toLowerCase());if(display)display.textContent=`${received<total?'Remaining bill':'Change due'}: ${money(Math.abs(received-total))}`;const refStatus=$('referenceMatchStatus');if(refStatus){refStatus.textContent=refMatches?'Reference matches. Confirm only after verifying the successful transaction.':'Reference does not match the customer’s submitted number.';refStatus.style.color=refMatches?'#176b3a':'#9a4c00'}if(button)button.disabled=!Number.isFinite(received)||received<total||!refMatches}
