<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodtraps Kitchen</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:#fff}header{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#181818}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{background:#fff;color:#222;border-radius:15px;padding:18px}.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:3px}.go{background:#176b3a;color:white}.stop{background:#b42318;color:white}.tag{display:inline-block;background:#eee;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:bold}.item{padding:8px 0;border-bottom:1px solid #eee}.hint{color:#666;font-size:13px}
/* Elegant coffee-and-cream theme matched to Admin */:root{--brown:#5b351f;--brown2:#7a4b2a;--cream:#f8f2e8;--paper:#fffdf8;--line:#eadfce;--text:#2e241e;--muted:#85776c;--shadow:0 8px 25px rgba(72,44,26,.08)}*{box-sizing:border-box}body{font-family:'DM Sans',Arial,sans-serif;margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(214,185,145,.24),transparent 36%),linear-gradient(135deg,#f8f2e8,#f2e8d9);background-attachment:fixed;color:var(--text)}header{position:relative;overflow:hidden;padding:18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#321b0f 0%,#5b351f 54%,#7a4b2a 100%);color:#fff;box-shadow:0 8px 24px rgba(50,27,15,.2)}header:after{content:"✦";position:absolute;right:27%;top:5px;color:rgba(255,245,220,.76);font-size:19px;text-shadow:0 0 12px #f8e2b2;animation:kitchenSparkle 3.2s ease-in-out infinite;pointer-events:none}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{background:rgba(255,253,248,.96);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 8px 24px rgba(72,44,26,.08),0 1px 2px rgba(72,44,26,.05)}.card h2{color:var(--brown)}.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:3px;background:#f1e4d4;color:var(--brown);transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(91,53,31,.15)}.go{background:linear-gradient(110deg,#5b351f,#7a4b2a);color:white}.stop{background:#b42318;color:white}.tag{display:inline-block;background:var(--cream);border:1px solid var(--line);color:var(--brown);padding:5px 9px;border-radius:99px;font-size:12px;font-weight:bold}.item{padding:8px 0;border-bottom:1px solid var(--line)}.hint{color:var(--muted);font-size:13px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}input{width:100%;box-sizing:border-box;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:#fffdf8;color:var(--text);font:inherit}input:focus{outline:none;border-color:var(--brown2);box-shadow:0 0 0 3px rgba(91,53,31,.1)}@keyframes kitchenSparkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.16) rotate(22deg)}}@media(max-width:500px){.grid{grid-template-columns:1fr;padding:12px}.card{padding:15px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}#app:has(.kitchen-login){min-height:calc(100vh - 68px);align-content:center}.kitchen-login{grid-column:1/-1;width:min(440px,100%);margin:0 auto;padding:30px;border-radius:18px}.login-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#f1e4d4,#fff8ed);border:1px solid var(--line);color:#a77b45;font-size:21px;box-shadow:0 3px 10px rgba(72,44,26,.08)}.login-eyebrow{margin:18px 0 5px;color:var(--brown2);font-size:10px;font-weight:800;letter-spacing:1.5px}.kitchen-login h2{margin:0;color:var(--brown);font-size:23px}.login-subtitle{margin:7px 0 22px;color:var(--muted);font-size:13px;line-height:1.5}.kitchen-login label{display:block;margin:13px 0 5px;color:#4a2b1b;font-size:12px;font-weight:700}.kitchen-login input{margin:0}.login-submit{width:100%;margin:20px 0 0;padding:12px}.login-footnote{margin:14px 0 0;text-align:center;color:var(--muted);font-size:11px}@media(max-width:500px){.kitchen-login{margin:0 auto;padding:22px}}</style></head><body><header><div style="display:flex;align-items:center;gap:10px"><img src="assets/foodtraps-logo.png" alt="" style="width:72px;height:42px;object-fit:contain;background:#fff8ed;border-radius:7px;padding:3px"><div><b>FOODTRAPS CAFÉ</b><div>KITCHEN DISPLAY</div></div></div><div style="display:flex;gap:8px"><button class="btn" onclick="load()">↻ Refresh</button><button class="btn stop" onclick="logout()">⏻ Log Out</button></div></header>
<div id="app" class="grid"></div>
<script>
let user='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){document.getElementById('app').innerHTML='<div class="card kitchen-login"><img src="assets/foodtraps-logo.png" alt="Foodtraps Café" style="display:block;width:150px;height:84px;object-fit:contain;margin:0 auto 12px"><div class="login-mark" aria-hidden="true">✦</div><p class="login-eyebrow">FOODTRAPS CAFÉ</p><h2>Kitchen Sign In</h2><p class="login-subtitle">Enter your staff credentials to open the kitchen display.</p><label for="u">Username</label><input id="u" autocomplete="username" placeholder="Enter username" value="kitchen"><label for="p">Password or PIN</label><input id="p" type="password" autocomplete="current-password" placeholder="Enter password or PIN" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn go login-submit" onclick="doLogin()">SIGN IN</button><button id="localTestLoginButton" class="btn login-submit" style="margin-top:6px;background:#eee;color:#333" onclick="quickLocalTestLogin()">LOCAL TEST ACCESS</button><p class="login-footnote">Authorized kitchen staff only</p></div>';if(!['localhost','127.0.0.1','::1'].includes(location.hostname.toLowerCase()))document.getElementById('localTestLoginButton')?.remove()}
function quickLocalTestLogin(){google.script.run.withSuccessHandler(r=>{user=r.username;load()}).withFailureHandler(showError).startLocalTestSession('KITCHEN')}
function doLogin(){google.script.run.withSuccessHandler(r=>{if(!r.ok)return alert(r.message);user=r.username;load()}).withFailureHandler(showError).loginStaff(document.getElementById('u').value,document.getElementById('p').value,'KITCHEN')}
function restoreKitchenSession(){google.script.run.withSuccessHandler(r=>{if(r&&r.role==='KITCHEN'){user=r.username;load()}else login()}).withFailureHandler(login).getStaffSession()}
function logout(){if(!confirm('Log out of the Kitchen Display?'))return;user='';google.script.run.withSuccessHandler(login).withFailureHandler(e=>{showError(e);login()}).logoutStaff()}
function showError(e){alert(e&&e.message||e)}
function load(){if(!user)return login();google.script.run.withSuccessHandler(render).withFailureHandler(showError).getStaffOrders()}
function render(list){
 const active=(list||[]).filter(o=>!['PAID','CANCELLED','COMPLETED','DELIVERED'].includes(String(o.status).toUpperCase()));
 document.getElementById('app').innerHTML=active.length?active.map(card).join(''):'<div class="card">No active kitchen orders.</div>';
}
function card(o){
 const status=String(o.status||'').toUpperCase(),orderType=String(o.orderType||'').toUpperCase(),delivery=orderType==='DELIVERY',packingRequired=delivery||['TAKE-OUT','PICK-UP'].includes(orderType);
 let action='';
 if(['CONFIRMED','PREPARING'].includes(status)){
   action=status==='PREPARING'&&packingRequired
     ?`<button class="btn go" onclick="setStatus('${esc(o.orderNumber)}','PACKING')">START PACKING</button>`
     :status==='PREPARING'
       ?`<button class="btn go" onclick="setStatus('${esc(o.orderNumber)}','READY')">MARK READY</button>`
       :`<button class="btn go" onclick="setStatus('${esc(o.orderNumber)}','PREPARING')">START PREPARING</button>`;
 }
 if(status==='PACKING')action=`<button class="btn go" onclick="setStatus('${esc(o.orderNumber)}','${delivery?'READY FOR DELIVERY':'READY'}')">${delivery?'READY FOR RIDER':'MARK READY'}</button>`;
 if(status==='READY'&&!delivery)action=`<button class="btn go" onclick="setStatus('${esc(o.orderNumber)}','COMPLETED')">COMPLETED / HANDED OVER</button>`;
 const readyText=status==='READY FOR DELIVERY'?'<p class="hint">Ready for rider pickup. This order is now in the Rider queue.</p>':'';const instructions=String(o.specialInstructions||'').trim();const instructionCard=instructions?`<div style="margin:10px 0;padding:9px 11px;background:#fff1d6;border-left:4px solid #b88950;border-radius:6px;color:#34251c;white-space:pre-wrap"><b>Customer special instructions</b><br>${esc(instructions)}</div>`:'';
 return `<div class="card"><h2>${esc(o.orderNumber)}</h2><b>${esc(o.customerName)}</b><p>${esc(o.orderType)}${delivery&&o.deliveryAddress?' · '+esc(o.deliveryAddress):''}</p><span class="tag">${esc(o.status)}</span>${readyText}${instructionCard}<hr>${(o.items||[]).map(i=>`<div class="item">${esc(i.itemName)} × ${i.quantity}</div>`).join('')}<br>${action}${['READY','READY FOR DELIVERY','OUT FOR DELIVERY','DELIVERED'].includes(status)?'':` <button class="btn stop" onclick="setStatus('${esc(o.orderNumber)}','CANCELLED')">CANCEL</button>`}</div>`;
}
function setStatus(id,status){google.script.run.withSuccessHandler(load).withFailureHandler(showError).setStaffOrderStatus(id,status,user)}
restoreKitchenSession();
</script></body></html>
