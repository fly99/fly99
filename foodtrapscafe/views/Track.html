<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodtraps Order Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f6f8;padding:20px;margin:0;color:#222}.card{max-width:760px;margin:auto;background:#fff;padding:24px;border-radius:15px;box-shadow:0 3px 16px #0001}h1{margin-top:0}.lookup{display:flex;gap:8px}input,button{padding:12px;border-radius:8px;font:inherit}input{flex:1;min-width:0;border:1px solid #ddd}button{border:0;background:#111;color:white;font-weight:bold;cursor:pointer}.status{margin:16px 0;padding:14px;border-radius:10px;background:#f2f2f2;line-height:1.6}.steps{display:grid;gap:0;margin:22px 0}.step{position:relative;display:flex;gap:13px;min-height:57px;color:#999}.step:not(:last-child):before{content:"";position:absolute;left:12px;top:26px;height:calc(100% - 5px);border-left:2px solid #ddd}.dot{z-index:1;flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e5e5e5;color:#777;font-size:12px;font-weight:bold}.step.done{color:#176b3a}.step.done .dot{background:#176b3a;color:#fff}.step.done:not(:last-child):before{border-color:#176b3a}.step.current{color:#222;font-weight:bold}.step.current .dot{background:#c99154;color:#fff}.step-copy{padding:3px 0 16px}.step-copy small{display:block;color:#777;font-weight:normal;margin-top:3px}.hint{font-size:13px;color:#666;line-height:1.5}#map{width:100%;height:340px;border-radius:12px;margin-top:15px;display:none;overflow:hidden}.alert{padding:12px;border-radius:9px;background:#fff1f0;color:#a1261c;margin-top:12px}.refresh{font-size:12px;color:#777;margin-top:12px}@media(max-width:520px){body{padding:10px}.card{padding:18px}.lookup{flex-direction:column}#map{height:280px}}
/* Elegant coffee-and-cream theme matched to Admin */:root{--brown:#5b351f;--brown2:#7a4b2a;--cream:#f8f2e8;--paper:#fffdf8;--line:#eadfce;--text:#2e241e;--muted:#85776c;--shadow:0 8px 25px rgba(72,44,26,.08)}body{font-family:'DM Sans',Arial,sans-serif;background:radial-gradient(ellipse at 12% 0%,rgba(214,185,145,.24),transparent 36%),linear-gradient(135deg,#f8f2e8,#f2e8d9);background-attachment:fixed;color:var(--text)}.card{position:relative;overflow:hidden;background:rgba(255,253,248,.96);border:1px solid var(--line);box-shadow:0 10px 32px rgba(72,44,26,.1),0 1px 2px rgba(72,44,26,.05)}.card:after{content:"✦";position:absolute;right:27px;top:18px;color:#caa978;font-size:20px;text-shadow:0 0 12px #f8e2b2;animation:trackSparkle 3.2s ease-in-out infinite;pointer-events:none}h1,h2{color:var(--brown)}h1{text-align:center}.lookup input{border-color:var(--line);background:#fffdf8;color:var(--text);outline:none}.lookup input:focus{border-color:var(--brown2);box-shadow:0 0 0 3px rgba(91,53,31,.1)}button{background:linear-gradient(110deg,#5b351f,#7a4b2a);box-shadow:0 3px 9px rgba(72,44,26,.18);transition:transform .18s ease,box-shadow .18s ease}button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(72,44,26,.22)}.status{background:var(--cream);border:1px solid var(--line);color:var(--text)}.step{color:#a1978c}.step:not(:last-child):before{border-color:var(--line)}.step.done{color:var(--brown)}.step.done .dot{background:var(--brown);color:#fff}.step.done:not(:last-child):before{border-color:var(--brown2)}.dot{background:#eee3d5;color:var(--brown2)}.step.current{color:var(--brown)}.step.current .dot{background:#c99a62;color:#fff;box-shadow:0 0 0 4px rgba(201,154,98,.16)}.step-copy small{color:var(--muted)}.hint,.refresh{color:var(--muted)}#map{border:1px solid var(--line);box-shadow:0 4px 14px rgba(72,44,26,.08)}@keyframes trackSparkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.16) rotate(22deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}.dot{flex:0 0 38px;width:38px;height:38px;font-size:20px}.step:not(:last-child):before{left:18px;top:38px}
.delivery-steps .step.current:nth-child(1) .dot,.pickup-steps .step.current:nth-child(1) .dot{animation:ft-frontdesk 1.5s ease-in-out infinite}.delivery-steps .step.current:nth-child(2) .dot,.pickup-steps .step.current:nth-child(2) .dot{animation:ft-cooking .8s ease-in-out infinite}.delivery-steps .step.current:nth-child(3) .dot,.pickup-steps .step.current:nth-child(3) .dot{animation:ft-ready 1.1s ease-in-out infinite}.delivery-steps .step.current:nth-child(4) .dot{animation:ft-riding .65s ease-in-out infinite}.delivery-steps .step.current:nth-child(5) .dot,.pickup-steps .step.current:nth-child(4) .dot{animation:ft-complete 1.2s ease-in-out infinite}@keyframes ft-frontdesk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ft-cooking{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes ft-ready{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}@keyframes ft-riding{0%,100%{transform:translateX(-2px) rotate(-2deg)}50%{transform:translateX(3px) rotate(2deg)}}@keyframes ft-complete{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@media(prefers-reduced-motion:reduce){.step.current .dot{animation:none!important}}
.step-copy{border-radius:8px;transition:background-color .2s ease,box-shadow .2s ease,padding .2s ease}.step.done .step-copy{padding:6px 10px 12px;background:#f1e8dc;border-left:3px solid #7a4b2a;color:#5b351f}.step.current .step-copy{padding:8px 11px 12px;background:#fff3da;border-left:4px solid #c99a62;color:#4a2b1b;box-shadow:0 3px 10px rgba(91,53,31,.1)}.step.current .step-copy small{color:#70563f}</style></head><body><div class="card"><h1>FOODTRAPS CAFÉ</h1><p>Track your order from the kitchen to delivery.</p>
<div class="lookup"><input id="q" placeholder="Order number"><button onclick="trackOrder()">TRACK</button></div><div id="result"></div><div id="map"></div><p id="mapHint" class="hint"></p><p id="refreshHint" class="refresh"></p></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const initial='<?= htmlspecialchars($order, ENT_QUOTES, 'UTF-8') ?>';
const $=id=>document.getElementById(id);
let map=null,marker=null,deliveryMarker=null,statusTimer=null,locationTimer=null,currentOrder='',lastOrder=null,lastRiderLocation=null;
if(initial)$('q').value=initial;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function trackOrder(){const id=$('q').value.trim();if(!id)return alert('Enter your order number.');currentOrder=id;clearInterval(statusTimer);clearInterval(locationTimer);if(map){map.remove();map=null}marker=null;deliveryMarker=null;lastRiderLocation=null;lastOrder=null;$('map').style.display='none';$('mapHint').textContent='';refreshStatus();statusTimer=setInterval(refreshStatus,8000)}
function refreshStatus(){if(!currentOrder)return;google.script.run.withSuccessHandler(order=>{
 if(!order){$('result').innerHTML='<div class="alert">Order not found. Check the number and try again.</div>';clearInterval(statusTimer);clearInterval(locationTimer);$('map').style.display='none';return}
 lastOrder=order;renderOrder(order);$('refreshHint').textContent='Status refreshes automatically every 8 seconds.';
 const status=String(order.status||'').toUpperCase();
 if(order.orderType==='Delivery'&&['OUT FOR DELIVERY','DELIVERED'].includes(status)){
   $('map').style.display='block';setTimeout(()=>{if(map)map.invalidateSize();},150);
   if(!locationTimer){refreshLocation();locationTimer=setInterval(refreshLocation,5000)}
 }else{clearInterval(locationTimer);locationTimer=null;$('map').style.display='none';$('mapHint').textContent=order.orderType==='Delivery'?'Rider location will appear after the rider starts the delivery.':''}
 if(['DELIVERED','COMPLETED','CANCELLED'].includes(status)){clearInterval(statusTimer);$('refreshHint').textContent='Order tracking is complete.'}
 }).withFailureHandler(e=>{$('result').innerHTML='<div class="alert">Could not refresh order status: '+esc(e&&e.message||e)+'</div>'}).getOrder(currentOrder)}
function renderOrder(o){
 const status=String(o.status||'').toUpperCase(),orderType=String(o.orderType||'').trim().toUpperCase(),delivery=orderType==='DELIVERY',needsPackaging=delivery||['TAKE-OUT','PICK-UP'].includes(orderType);
 let steps,active=-1;
 if(delivery){
   steps=[['👩‍💼','Received by Front Desk','Front Desk has received your order.'],['📨','Sent to Kitchen','Front Desk sent your order to the kitchen.'],['👩‍🍳','Kitchen preparing','The kitchen is preparing your items.'],['📦','Packing order','Your order is being packed for delivery.'],['🍽️','Ready for rider','Your order is packed and ready for rider pickup.'],['🏍️','Out for delivery','Your rider is on the way.'],['✅','Delivered','Your order has been delivered.']];
   if(['NEW','PENDING',''].includes(status))active=0;
   else if(status==='CONFIRMED')active=1;
   else if(status==='PREPARING')active=2;
   else if(status==='PACKING')active=3;
   else if(status==='READY FOR DELIVERY')active=4;
   else if(status==='READY')active=3;
   else if(status==='OUT FOR DELIVERY')active=5;
   else if(status==='DELIVERED'||(status==='COMPLETED'&&delivery))active=6;
 }else{
   steps=[['👩‍💼','Received by Front Desk','Front Desk has received your order.'],['📨','Sent to Kitchen','Front Desk sent your order to the kitchen.'],['👩‍🍳','Kitchen preparing','The kitchen is preparing your items.']];
   if(needsPackaging)steps.push(['📦','Packing order','Your order is being packed for customer pickup.']);
   steps.push(['🍽️','Ready','Your order is ready.'],['✅','Completed','Your order is complete.']);
   if(['NEW','PENDING',''].includes(status))active=0;
   else if(status==='CONFIRMED')active=1;
   else if(status==='PREPARING')active=2;
   else if(status==='PACKING'&&needsPackaging)active=3;
   else if(status==='READY')active=needsPackaging?4:3;
   else if(status==='COMPLETED')active=needsPackaging?5:4;
 }
 let exception='';
 if(status==='CANCELLED')exception='<div class="alert">This order was cancelled.</div>';
 else if(status.includes('HOLD'))exception='<div class="alert">This order is on hold while the customer decision is confirmed.</div>';
 else if(active<0)exception='<div class="alert">Current order status: '+esc(o.status)+'.</div>';
 const timeline=active>=0?`<div class="steps ${delivery?'delivery-steps':'pickup-steps'}">${steps.map((x,i)=>`<div class="step ${i<active?'done':i===active?'current':''}"><span class="dot" role="img" aria-label="${esc(x[1])}">${x[0]}</span><div class="step-copy">${esc(x[1])}${i===active?`<small>${esc(x[2])}</small>`:''}</div></div>`).join('')}</div>`:'';
 const hasDestination=(o.deliveryLatitude!==null&&o.deliveryLatitude!==undefined&&o.deliveryLongitude!==null&&o.deliveryLongitude!==undefined)||String(o.deliveryAddress||'').trim()!=='';
 $('result').innerHTML=`<hr><h2>${esc(o.orderNumber)}</h2><div class="status">${delivery?(o.riderName?'<b>RIDER: '+esc(o.riderName)+'</b><br>':'<b>RIDER: Not assigned yet</b><br>'):''}<b>STATUS: ${esc(o.status)}</b><br>${esc(o.customerName)} · ${esc(o.orderType)}<br>Total: ₱${Number(o.total||0).toFixed(2)}${o.packagingNote?`<br>Packaging note: ${esc(o.packagingNote)}`:''}${delivery?'<br>📍 '+esc(o.deliveryAddress||((o.deliveryLatitude!==null&&o.deliveryLatitude!==undefined&&o.deliveryLongitude!==null&&o.deliveryLongitude!==undefined)?`${o.deliveryLatitude}, ${o.deliveryLongitude}`:'Delivery location not provided')):''}</div>${delivery&&hasDestination?'<a id="customerDirections" href="'+esc(customerDirectionsUrl(o))+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:10px;padding:10px 14px;border-radius:8px;background:#5b351f;color:white;text-decoration:none;font-weight:bold">🗺️ OPEN DIRECTIONS IN GOOGLE MAPS</a>':''}${exception}${timeline}`;
}
function customerDirectionsUrl(order){const hasPin=order.deliveryLatitude!==null&&order.deliveryLatitude!==undefined&&order.deliveryLongitude!==null&&order.deliveryLongitude!==undefined;const destination=hasPin?`${Number(order.deliveryLatitude)},${Number(order.deliveryLongitude)}`:String(order.deliveryAddress||'').trim();const params=new URLSearchParams({api:'1',destination,travelmode:'driving'});if(lastRiderLocation&&Number.isFinite(Number(lastRiderLocation.lat))&&Number.isFinite(Number(lastRiderLocation.lng)))params.set('origin',`${Number(lastRiderLocation.lat)},${Number(lastRiderLocation.lng)}`);return 'https://www.google.com/maps/dir/?'+params.toString()}
function ensureTrackMap(){if(map)return;map=L.map('map').setView([10.8981326,123.4161286],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
function showDeliveryDestination(order){const lat=Number(order.deliveryLatitude),lng=Number(order.deliveryLongitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;ensureTrackMap();if(!deliveryMarker)deliveryMarker=L.marker([lat,lng]).addTo(map).bindPopup('Customer delivery location');else deliveryMarker.setLatLng([lat,lng]);if(!marker)map.setView([lat,lng],15);else map.fitBounds(L.latLngBounds([marker.getLatLng(),deliveryMarker.getLatLng()]).pad(.2));}
function refreshLocation(){if(!currentOrder)return;google.script.run.withSuccessHandler(loc=>{
 if(!loc){if(lastOrder)showDeliveryDestination(lastOrder);$('mapHint').textContent='Waiting for the rider to share GPS location…';return}
 const lat=Number(loc.lat),lng=Number(loc.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
 lastRiderLocation={lat,lng};const directions=$('customerDirections');if(directions&&lastOrder)directions.href=customerDirectionsUrl(lastOrder);
 ensureTrackMap();if(!marker)marker=L.marker([lat,lng]).addTo(map).bindPopup('Foodtraps Rider').openPopup();else marker.setLatLng([lat,lng]);if(lastOrder)showDeliveryDestination(lastOrder);if(deliveryMarker)map.fitBounds(L.latLngBounds([marker.getLatLng(),deliveryMarker.getLatLng()]).pad(.2));else map.setView([lat,lng],16);setTimeout(()=>map&&map.invalidateSize(),250);
 $('mapHint').textContent='Rider location updated: '+new Date(loc.updatedAt).toLocaleTimeString();
 }).withFailureHandler(e=>{$('mapHint').textContent='Unable to load rider location right now.'}).getRiderLocation(currentOrder)}
if(initial)trackOrder();
</script></body></html>
